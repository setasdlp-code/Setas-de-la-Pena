<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4f6352"/></marker></defs><text x="24" y="34" font-family="Plex" font-size="13" font-weight="400" text-anchor="start" fill="#8a3e2d">DOS PATRONES DE AGUA VISIBLE · HIPÓTESIS A CONTRASTAR</text><rect x="24" y="52" width="370" height="150" rx="4" fill="#e4ead9" stroke="#6f8a68" stroke-width="1.2"/><text x="44" y="84" font-family="Plex" font-size="17" font-weight="600" text-anchor="start" fill="#2e3b2f">En pared o puerta</text><text x="44" y="116" font-family="Plex" font-size="14" font-weight="400" text-anchor="start" fill="#2e3b2f">· ¿Superficie más fría que el punto de rocío?</text><text x="44" y="142" font-family="Plex" font-size="14" font-weight="400" text-anchor="start" fill="#2e3b2f">· ¿Entrada de aire exterior al abrir?</text><text x="44" y="180" font-family="Plex" font-size="13" font-weight="400" text-anchor="start" fill="#4f6352">Medir: temperatura de superficie</text><rect x="426" y="52" width="370" height="150" rx="4" fill="#e4ead9" stroke="#6f8a68" stroke-width="1.2"/><text x="446" y="84" font-family="Plex" font-size="17" font-weight="600" text-anchor="start" fill="#2e3b2f">Frente a humidificación</text><text x="446" y="116" font-family="Plex" font-size="14" font-weight="400" text-anchor="start" fill="#2e3b2f">· ¿Mojado directo por la descarga?</text><text x="446" y="142" font-family="Plex" font-size="14" font-weight="400" text-anchor="start" fill="#2e3b2f">· Cotejar trayectoria y alcance de gotas</text><text x="446" y="180" font-family="Plex" font-size="13" font-weight="400" text-anchor="start" fill="#4f6352">Medir: ciclos del humidificador</text><rect x="24" y="226" width="772" height="72" rx="4" fill="#f3efe3" stroke="#b9a98f" stroke-width="1.2"/><text x="44" y="256" font-family="Plex" font-size="15" font-weight="600" text-anchor="start" fill="#2e3b2f">Datos para distinguir patrones</text><text x="44" y="282" font-family="Plex" font-size="13.5" font-weight="400" text-anchor="start" fill="#2e3b2f">Temperatura superficial · punto de rocío del aire · hora de apertura de puerta · ciclos de humidificación</text></svg>
