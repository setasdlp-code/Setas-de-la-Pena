# =============================================================================
# ESPHome — Incubadora del piloto de shiitake (80 x 60 x 100 cm)
# Setas de la Peña · Tenjo, Cundinamarca · 2600 m s.n.m.
# STATUS: BANCO DE PRUEBAS / NO COMISIONADO / NO USAR EN PRODUCCIÓN
# Spec: docs/superpowers/specs/2026-10-13-piloto-shiitake-incubacion-design.md
# =============================================================================
# Control local de temperatura únicamente. Sin humedad ni CO2 como lazo.
# La protección térmica física (bimetálico 35 °C + fusible térmico) es
# independiente de este firmware y se instala en el cableado del calefactor.
# =============================================================================

substitutions:
  device_name: incubadora-piloto
  friendly_name: "Incubadora piloto"

  # --- Hardware ---
  # Módulo de relé Hosyond: la polaridad activa no está verificada. Confirmar
  # en el banco antes de conectar la carga de red (ver protocolo).
  relay_heater_pin: GPIO26
  relay_active_low: "true"
  sda_pin: GPIO21
  scl_pin: GPIO22
  onewire_pin: GPIO4   # bus 1-Wire con pull-up físico de 4,7 kΩ a 3,3 V

  # Direcciones 1-Wire de las DS18B20. Marcadores distintos entre sí: se
  # reemplazan por las direcciones reales tras el escaneo en el banco. Cada
  # sonda se identifica por su dirección fija, nunca por orden de escaneo.
  addr_base: "0x0000000000000001"
  addr_centro: "0x0000000000000002"
  addr_tope: "0x0000000000000003"
  addr_nucleo: "0x0000000000000004"

  # --- Control y seguridad ---
  # El setpoint NO está en este archivo: depende de la cepa y se fija desde la
  # especificación del lote 1 (el termostato arranca en OFF sin objetivo).
  # La histéresis arranca en 0.5 °C (valor técnico por defecto de ESPHome, no
  # biológico) y se sobrescribe con la especificación del lote.
  histeresis_c: "0.5"
  fan_min_rpm: "500"            # valor provisional, a validar en el banco
  fan_arranque_gracia_s: "20"   # el tacómetro puede marcar cero al arrancar
  fan_tach_pin: GPIO25          # tacómetro del ventilador (Noctua NF-P12, 2 pulsos/vuelta)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Banco de pruebas incubadora piloto · no comisionado"
  # Tras cualquier reinicio o corte de energía el termostato arranca apagado,
  # aunque ESPHome haya restaurado el modo calefacción desde la memoria flash.
  on_boot:
    priority: -100
    then:
      - climate.control:
          id: incubadora
          mode: "OFF"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# --- Calefactor (cargas de 120 V solo a través de relé con aislamiento) ---
switch:
  - platform: gpio
    id: rele_calefactor
    name: "Relé calefactor"
    pin:
      number: ${relay_heater_pin}
      inverted: ${relay_active_low}
    restore_mode: ALWAYS_OFF

# --- Buses ---
i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true

one_wire:
  - platform: gpio
    pin: ${onewire_pin}

# --- Sensores ---
# Los sensores de control (t_aire, t_nucleo) pasan a NaN si dejan de actualizar
# durante 120 s, de modo que un valor congelado se trata como sensor inválido.
sensor:
  # Aire: SHT45 con membrana, protegido de goteo y lejos del calefactor.
  - platform: sht4x
    update_interval: 30s
    temperature:
      id: t_aire
      name: "T aire"
      filters:
        - timeout:
            timeout: 120s
            value: .nan
    humidity:
      id: hr_aire
      name: "HR aire (diagnóstico)"

  # Mapa térmico vertical: base, centro y parte superior de la carga.
  - platform: dallas_temp
    address: ${addr_base}
    id: t_base
    name: "T base"
    update_interval: 30s
  - platform: dallas_temp
    address: ${addr_centro}
    id: t_centro
    name: "T centro"
    update_interval: 30s
  - platform: dallas_temp
    address: ${addr_tope}
    id: t_tope
    name: "T tope"
    update_interval: 30s

  # Núcleo de un bloque testigo (sonda inox de 100 mm). Media móvil α = 0,1.
  - platform: dallas_temp
    address: ${addr_nucleo}
    id: t_nucleo
    name: "T núcleo"
    update_interval: 30s
    filters:
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
      - timeout:
          timeout: 120s
          value: .nan

  # CO2 solo diagnóstico. Una única estrategia de compensación: altitud fija.
  - platform: scd30
    update_interval: 30s
    altitude_compensation: 2600m
    co2:
      id: co2
      name: "CO2 (diagnóstico)"

  # Diferencia núcleo - aire.
  - platform: template
    id: dt_nucleo_aire
    name: "ΔT núcleo - aire"
    unit_of_measurement: "°C"
    update_interval: 30s
    lambda: |-
      return id(t_nucleo).state - id(t_aire).state;

  # Ventilador del plenum: tacómetro. pulse_counter entrega pulsos/min; el
  # Noctua da 2 pulsos por vuelta, de ahí el factor 0.5 para obtener rpm.
  - platform: pulse_counter
    id: rpm_ventilador
    name: "RPM ventilador"
    pin:
      number: ${fan_tach_pin}
      mode: INPUT_PULLUP
    unit_of_measurement: "rpm"
    update_interval: 10s
    filters:
      - multiply: 0.5

# --- Alarmas (todas apagan el calefactor, ver interval de seguridad) ---
binary_sensor:
  - platform: template
    id: alarma_sobretemp_nucleo
    name: "ALARMA núcleo > 28 °C"
    device_class: problem
    lambda: |-
      return !isnan(id(t_nucleo).state) && id(t_nucleo).state > 28.0;
  - platform: template
    id: alarma_dt_nucleo_aire
    name: "ALARMA núcleo - aire > 5 °C"
    device_class: problem
    lambda: |-
      return !isnan(id(dt_nucleo_aire).state) && id(dt_nucleo_aire).state > 5.0;
  - platform: template
    id: alarma_sensor_invalido
    name: "ALARMA sensor inválido"
    device_class: problem
    lambda: |-
      return isnan(id(t_aire).state) || isnan(id(t_nucleo).state);
  - platform: template
    id: alarma_ventilador
    name: "ALARMA ventilador detenido"
    device_class: problem
    lambda: |-
      if (millis() < ${fan_arranque_gracia_s} * 1000UL) return false;
      return isnan(id(rpm_ventilador).state) || id(rpm_ventilador).state < ${fan_min_rpm};

# --- Termostato: calienta, no enfría ---
climate:
  - platform: thermostat
    id: incubadora
    name: "Incubadora"
    sensor: t_aire
    min_heating_off_time: 60s
    min_heating_run_time: 30s
    min_idle_time: 30s
    heat_deadband: ${histeresis_c}
    heat_overrun: ${histeresis_c}
    heat_action:
      - if:
          condition:
            not:
              or:
                - binary_sensor.is_on: alarma_sobretemp_nucleo
                - binary_sensor.is_on: alarma_dt_nucleo_aire
                - binary_sensor.is_on: alarma_sensor_invalido
                - binary_sensor.is_on: alarma_ventilador
          then:
            - switch.turn_on: rele_calefactor
    idle_action:
      - switch.turn_off: rele_calefactor

# --- Interbloqueo: cualquier alarma apaga el calefactor y el termostato ---
# No se reenciende solo: requiere acción del operador.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: alarma_sobretemp_nucleo
              - binary_sensor.is_on: alarma_dt_nucleo_aire
              - binary_sensor.is_on: alarma_sensor_invalido
              - binary_sensor.is_on: alarma_ventilador
          then:
            - switch.turn_off: rele_calefactor
            - climate.control:
                id: incubadora
                mode: "OFF"
