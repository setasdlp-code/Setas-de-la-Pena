# =============================================================================
# ESPHome — CLOUDLAB 844 (Cámara de Fructificación Principal)
# Setas de la Peña · Tenjo, Cundinamarca · 2600 m s.n.m.
# STATUS: BANCO DE PRUEBAS / NO COMISIONADO / NO USAR EN PRODUCCIÓN
# =============================================================================
# Firmware ÚNICO del nodo `setas-cloudlab-01`: control local + publicación.
# Sustituye para este nodo al perfil solo-telemetría
# field-os-simulador/setas-os/telemetry-publisher/esphome-cloudlab.yaml
# (un ESP32 graba un solo firmware; no grabar ambos).
#
# ARQUITECTURA (opción A, DEC-001, knowledge_base/05_equipment/environmental_control.md)
#   · El control vive en el ESP32 (esphome/modulo-fructificacion.package.yaml).
#   · Setas OS y Home Assistant solo LEEN. Ningún relé es mandable por red.
#   · El estado del nodo (relés comandados, alarmas, consigna vigente) se
#     publica por la ruta existente publicador → Firestore
#     (telemetry-publisher/esphome-publish.package.yaml).
#   · Si falla la red el control sigue (reboot_timeout: 0s en wifi y api).
#
# CONSIGNAS: SIN valor por defecto. Las genera
#   field-os-simulador/setas-os/room-node-setpoints.js desde el ciclo de sala
#   activo. Sin ellas `esphome config` falla (marcadores PENDIENTE_*). Ejemplo:
#     esphome -s heat_setpoint_c <°C> -s histeresis_c <°C> -s temp_max_c <°C> \
#             -s consigna_id <id> config cloudlab_esp32.yaml
#   Los valores "provisionales" de la plantilla anterior (hr_min 85, hr_max 90,
#   HR 92 %, co2_max 2000, temp_min 20, temp_max 30, luz 07–11 h) NO tienen
#   fuente en knowledge_base/ y se retiraron: no son consignas.
#
# SENSORES
#   Control T  : SHT31 (I2C 0x44), filtro timeout → NaN → calefacción OFF + alarma
#   CO₂        : SCD30 (I2C 0x61), compensación por altitud 2600 m (diagnóstico)
#
# ACTUADORES — módulo de relés de 4 canales, 5 V, optoacoplado, disparo ALTO
#   CH1 GPIO26 → Tira LED 12 V (fotoperiodo desactivado hasta que el operario lo fije)
#   CH2 GPIO27 → Circulación GDSTIME (con la calefacción o "Circulación continua")
#   CH3 GPIO25 → Calefacción (reservado — QuietWarmth / panel)
#   CH4 GPIO33 → Reserva (siempre OFF)
#   Pines elegidos fuera de los de arranque (strapping 0, 2, 5, 12, 15 según
#   esphome/components/esp32/gpio_esp32.py de ESPHome 2026.10.2). La plantilla
#   anterior usaba GPIO12 (strapping: con nivel alto en reset puede impedir el
#   arranque) y GPIO14 (se le atribuye un pulso en el arranque; NO VERIFICADO
#   en fuente primaria, se evita igualmente). GPIO16/17 se evitan: UART2 del
#   MH-Z19C según DOC-0026 y PSRAM en módulos WROVER. Que ningún pin elegido
#   emita un pulso entre el reset y el setup NO está demostrado: se mide en el
#   protocolo de banco (esphome/PROTOCOLO_BANCO_CLOUDLAB.md, pasos 2-4).
#
# NO CONTROLADOS (bloqueados por comisionamiento; ver final del paquete)
#   · CloudForge T7: sin calibración de HR en rango alto ni protección frente
#     al agua. Sigue en su modo propio; este firmware solo registra HR.
#   · Cloudline H4: BLOQUEANTE medir caudal efectivo y documentar el control por
#     CO₂ antes de producción. Sin interfaz PWM / 0-10 V definida.
# =============================================================================

substitutions:
  device_name: setas-cloudlab-01
  friendly_name: "CLOUDLAB 844"
  # Identidad ante el publicador (clave del archivo privado de dispositivos).
  sensor_device_id: setas-cloudlab-01
  setas_timezone: "America/Bogota"
  # El SCD30 compensa altitud en firmware (altitude_compensation): el puente de
  # la app no debe volver a corregir (telemetry-publisher/README.md).
  setas_co2_pressure_compensated: "true"

  # --- Hardware ---
  sda_pin: GPIO21
  scl_pin: GPIO22
  relay_luz_pin: GPIO26
  relay_circulacion_pin: GPIO27
  relay_calefaccion_pin: GPIO25
  relay_reserva_pin: GPIO33

  # --- Validez del sensor de control ---
  # SHT31 cada 30 s; sin dato nuevo en 120 s se publica NaN (como la incubadora).
  sensor_timeout_s: "120"

packages:
  modulo: !include esphome/modulo-fructificacion.package.yaml
  publicacion: !include field-os-simulador/setas-os/telemetry-publisher/esphome-publish.package.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Banco de pruebas CLOUDLAB · no comisionado para producción"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# --- WiFi ---
# reboot_timeout: 0s en wifi y api: por defecto ESPHome reinicia tras 15 min
# sin red/HA y cada reinicio apaga la calefacción durante la estabilización.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true
  frequency: 100kHz

# =============================================================================
# SENSORES
# =============================================================================
sensor:
  # --- SHT31: sensor de CONTROL de temperatura (DEC-002) ---
  # Sin media móvil: la ventana deslizante de ESPHome ignora los NaN y seguiría
  # publicando valores viejos. El `timeout` convierte un sensor congelado o
  # desconectado en NaN, que apaga la calefacción y levanta la alarma.
  - platform: sht3xd
    address: 0x44
    update_interval: 30s
    temperature:
      id: room_temp
      name: "Temperatura (SHT31)"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - timeout:
            timeout: ${sensor_timeout_s}s
            value: .nan
      on_value: !include field-os-simulador/setas-os/telemetry-publisher/esphome-capture-temp.yaml
    humidity:
      id: room_humidity
      name: "Humedad Relativa (SHT31)"
      unit_of_measurement: "%"
      accuracy_decimals: 1
      # Solo registro: la HR no acciona nada hasta calibrar el rango alto.
      filters:
        - timeout:
            timeout: ${sensor_timeout_s}s
            value: .nan
      on_value: !include field-os-simulador/setas-os/telemetry-publisher/esphome-capture-rh.yaml

  # --- SCD30: CO₂ diagnóstico con compensación de altitud ---
  # Una sola estrategia: altitud fija 2600 m (no combinar con presión ambiente).
  # ASC desactivado: la cámara nunca ve aire de referencia a ~400 ppm.
  - platform: scd30
    address: 0x61
    update_interval: 60s
    altitude_compensation: 2600m
    automatic_self_calibration: false
    co2:
      id: co2_ppm
      name: "CO₂ (SCD30)"
      unit_of_measurement: "ppm"
      accuracy_decimals: 0
      on_value:
        then:
          - lambda: |-
              auto t = id(setas_publish_clock).utcnow();
              id(setas_co2_value) = x;
              id(setas_co2_at) = t.is_valid() && std::isfinite(x) ? t.strftime("%Y-%m-%dT%H:%M:%SZ") : "";
    temperature:
      id: temp_scd30
      name: "Temperatura (SCD30 — ref)"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      id: hr_scd30
      name: "Humedad Relativa (SCD30 — ref)"
      unit_of_measurement: "%"
      accuracy_decimals: 1

  # --- Diagnóstico: discrepancia entre sensores (solo registro) ---
  # Sin umbral de alarma: los 3 °C / 5 % de la plantilla anterior no tienen
  # fuente. Las alertas, si se aprueban, las define el comisionamiento.
  - platform: template
    name: "Delta Temperatura (SHT31 vs SCD30)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return fabsf(id(room_temp).state - id(temp_scd30).state);
  - platform: template
    name: "Delta HR (SHT31 vs SCD30)"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return fabsf(id(room_humidity).state - id(hr_scd30).state);

  - platform: uptime
    name: "Uptime CLOUDLAB"
    update_interval: 3600s

# =============================================================================
# DIAGNÓSTICO Y SERVICIO
# =============================================================================
button:
  - platform: restart
    name: "Reiniciar ESP32"
    icon: "mdi:restart"

binary_sensor:
  - platform: status
    name: "Estado Conexión CLOUDLAB"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP CLOUDLAB"
    ssid:
      name: "WiFi SSID CLOUDLAB"

# =============================================================================
# NOTAS DE PUESTA EN MARCHA — ver esphome/PROTOCOLO_BANCO_CLOUDLAB.md
# =============================================================================
# 1. Verificar i2c scan: 0x44 (SHT31) y 0x61 (SCD30).
# 2. Confirmar en banco, con la carpa vacía y sin carga de red, la polaridad del
#    módulo (jumper en disparo ALTO, `inverted: false`) y el estado de cada
#    canal entre el reset y el setup (entrada flotante).
# 3. SCD30: seguir el procedimiento del fabricante con una referencia conocida.
#    No inferir concentraciones por regla de tres con la altitud.
# 4. BLOQUEANTE: medir caudal del H4 y documentar control por CO₂ antes de producción.
# 5. BLOQUEANTE: calibrar HR en rango alto y proteger el sensor del agua antes
#    de automatizar el CloudForge T7.
