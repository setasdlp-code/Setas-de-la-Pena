# Legado/inactivo: la app canónica en producción es Setas OS v5
# (field-os-simulador/setas-os/), desplegada vía Netlify. Este workflow
# publicaba el index.html de la raíz del repo por GitHub Pages, que ya no
# es el sitio real. Se deja solo con disparo manual por si hace falta
# recuperar ese sitio legado deliberadamente.
name: Deploy to GitHub Pages (legado, desactivado)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
