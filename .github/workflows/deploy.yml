# Publica Setas OS v5 (field-os-simulador/setas-os/), la app canónica,
# en GitHub Pages en cada push a main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Preparar index.html
        run: cp "field-os-simulador/setas-os/Setas OS v5.dc.html" "field-os-simulador/setas-os/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'field-os-simulador/setas-os'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
