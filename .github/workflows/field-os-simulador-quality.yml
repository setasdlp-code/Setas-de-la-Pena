name: Field OS Simulador Quality

on:
  pull_request:
    paths:
      - "field-os-simulador/setas-os/**"
      - ".github/workflows/field-os-simulador-quality.yml"
  push:
    paths:
      - "field-os-simulador/setas-os/**"
      - ".github/workflows/field-os-simulador-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-os-simulador/setas-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # No build step and no package-lock.json here (static HTML/JS/CSS, no
      # bundler) — the test suite is pure Node built-ins, so it runs directly
      # with no npm install needed.
      - name: Run quality gate
        run: npm run test
