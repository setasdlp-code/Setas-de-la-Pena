name: Field OS Simulador Quality

on:
  pull_request:
    paths:
      - "field-os-simulador/setas-os/**"
      - ".github/workflows/field-os-simulador-quality.yml"
  push:
    branches: [main]
    paths:
      - "field-os-simulador/setas-os/**"
      - ".github/workflows/field-os-simulador-quality.yml"

permissions:
  contents: read

concurrency:
  group: field-os-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-os-simulador/setas-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: perito-evidence-display.test.js compara
          # scoring.js/perito-scenarios.js contra main (invariante ADR-0004).
          # Con el checkout superficial por defecto ese ref no existe en un
          # pull_request y el guard falla por falta de referencia, no por
          # una violacion real.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # El cuaderno de campo persiste en IndexedDB, que Node no trae, así que las
      # pruebas de esa capa necesitan fake-indexeddb. La suite dejó de ser sólo
      # built-ins; sin instalar dependencias los siete archivos que la ejercitan
      # fallan por módulo ausente, no por una regresión real.
      - name: Install dependencies
        run: npm ci
      # Paso 1 Quality Gate measures real computed FIELD targets and performs a
      # genuine offline reload in headless Chromium. Browser installation is
      # explicit so CI certifies the same runtime contract as local Playwright.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # simulador-app.jsx DOES have a build step (node build.js -> esbuild), but
      # CI never runs it — build.test.js verifies the committed bundle's
      # source-hash matches the source, so a stale bundle fails here instead.
      # Separado en dos pasos a propósito: la suite unitaria (~5 s, sin
      # navegador) y los gates de Criterio (Chromium headless) fallan por
      # razones distintas. Con un solo paso, un Chromium mal instalado se lee
      # igual que una regresión de lógica.
      - name: Run unit suite
        run: npm run test:unit
      - name: Run Criterio browser gates
        run: npm run test:gates
      # Compuerta empírica: ¿el cambio predice mejor o peor el EB real?
      # El corpus trae rendimientos de la finca y este repositorio es público,
      # así que no está versionado: se inyecta como secret (GROUND_TRUTH_CORPUS,
      # el JSON completo). Sin secret el paso no se salta en silencio — dice que
      # el cambio no fue validado contra campo, que es información, no ruido.
      - name: Perito regression against field evidence
        env:
          GROUND_TRUTH_CORPUS: ${{ secrets.GROUND_TRUTH_CORPUS }}
        run: |
          if [ -z "$GROUND_TRUTH_CORPUS" ]; then
            echo "::notice title=Sin corpus de campo::No hay GROUND_TRUTH_CORPUS configurado. Los cambios a analyze()/scoring.js/perito-scenarios.js NO fueron validados contra lotes reales — solo contra tests sintéticos."
            exit 0
          fi
          printf '%s' "$GROUND_TRUTH_CORPUS" > ground-truth-fixtures.json
          node perito-regression-report.js --baseline=origin/${{ github.base_ref || 'main' }}
        continue-on-error: false
