name: Field OS Simulador Quality

on:
  pull_request:
    paths:
      - "field-os-simulador/setas-os/**"
      - ".github/workflows/field-os-simulador-quality.yml"
  push:
    branches: [main]
    paths:
      - "field-os-simulador/setas-os/**"
      - ".github/workflows/field-os-simulador-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-os-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Certificación de Calidad Setas OS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-os-simulador/setas-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: perito-evidence-display.test.js compara
          # scoring.js/perito-scenarios.js contra main (invariante ADR-0004).
          fetch-depth: 0

      - name: Preflight — Git diff check
        run: git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate 1 — Source & Bundle Consistency
        run: node build.test.js

      - name: Gate 2 — Logic & Unit Tests
        run: npm test

      - name: Gate 3 — Server, Rules & Functions Emulator
        run: |
          npm run functions:sync
          npx firebase emulators:exec --only firestore --project sdlp-os-ci "node --test tests/rules/*.test.js tests/functions/*.test.js"

      - name: Gate 4 — Browser Critical & Offline Integration
        run: npm run test:browser

      - name: Gate 5 — Full Playwright E2E Matrix
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Release Status Check (Post-merge audit)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SDLP_OS }}
        run: |
          if [ -z "$SA" ]; then
            {
              echo "## ⚠️ RELEASE STATUS: DEPLOYMENT_INCOMPLETE"
              echo ""
              echo "Todos los quality gates de código, emuladores y pruebas pasaron exitosamente,"
              echo "pero falta la credencial \`FIREBASE_SERVICE_ACCOUNT_SDLP_OS\` para el despliegue automático."
              echo "El commit en \`main\` no debe considerarse desplegado en producción hasta realizar el despliegue manual:"
              echo ""
              echo '```bash'
              echo 'cd field-os-simulador/setas-os'
              echo 'npx firebase deploy --only firestore:rules --project sdlp-os'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ RELEASE STATUS: VERIFIED & READY" >> "$GITHUB_STEP_SUMMARY"
          fi
