# Publica la web pública (https://setas-de-la-pena.pages.dev) en Cloudflare Pages.
#
# Manual: Actions → «Deploy public website» → Run workflow, solo desde main.
# Repite el procedimiento de docs/public-website.md: exporta, verifica el
# paquete servido en local, despliega con Wrangler y comprueba el sitio
# publicado contra el paquete exacto.
#
# Requiere el secreto de repositorio CLOUDFLARE_API_TOKEN: un API Token con
# permiso «Account · Cloudflare Pages · Edit». No uses la Global API Key.
name: Deploy public website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 2f1f68a060057369109ea9f699e613cb
  PAGES_PROJECT: setas-de-la-pena
  WRANGLER_VERSION: 4.166.0

jobs:
  deploy:
    name: Export, verify and deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto de repositorio CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-public-website.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install export dependencies
        run: python -m pip install -r scripts/requirements-public-website.txt

      - name: Install browser for the checks
        working-directory: field-os-simulador/setas-os
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Export public website
        run: python scripts/export_public_website.py --output "$RUNNER_TEMP/setas/public"

      - name: Verify export and delivery
        run: |
          CHROMIUM_EXECUTABLE_PATH="$(node -p "require('./field-os-simulador/setas-os/node_modules/@playwright/test').chromium.executablePath()")"
          export CHROMIUM_EXECUTABLE_PATH
          python scripts/serve_public_website.py --directory "$RUNNER_TEMP/setas/public" --port 4188 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4188/home && break
            sleep 1
          done
          SETAS_EXPORT_AUDIT_DIR="$RUNNER_TEMP/setas" node scripts/quality/check_public_export.cjs
          SETAS_EXPORT_AUDIT_DIR="$RUNNER_TEMP/setas" node scripts/quality/check_public_delivery.cjs

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy "$RUNNER_TEMP/setas/public" \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --format=%s)" \
            --commit-dirty=false

      - name: Verify published site
        run: |
          # The production alias can take a few seconds to serve the new deployment.
          for attempt in 1 2 3 4; do
            if python scripts/quality/check_public_live.py --artifact "$RUNNER_TEMP/setas/public" --report "$RUNNER_TEMP/setas/live-verification.json"; then
              exit 0
            fi
            echo "Live check attempt $attempt failed; retrying in 30 s."
            sleep 30
          done
          exit 1

      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-website-reports
          path: ${{ runner.temp }}/setas/*.json
          if-no-files-found: ignore
          retention-days: 30
