# Telemetry-only starting point, not a replacement for commissioned control firmware.
esphome:
  name: ${sensor_device_id}
esp32:
  board: esp32dev
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
logger:
  level: INFO
api:
  encryption:
    key: !secret setas_api_key
  reboot_timeout: 0s
ota:
  - platform: esphome
    password: !secret ota_password
i2c:
  id: setas_sensor_bus
  sda: GPIO21
  scl: GPIO22
  scan: true
