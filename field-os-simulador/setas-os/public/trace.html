<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trazabilidad · Setas de la Peña</title>
<meta name="robots" content="noindex" />
<style>
  :root{
    --ink-900:#1B1A17;--ink-600:#5A564C;--ink-500:#7A756A;
    --paper-50:#FDFCF7;--paper-100:#F5F2E9;--paper-0:#FFFFFF;
    --border-soft:#D8D3C5;--moss-700:#3B5A24;--moss-100:#E8F0E0;--moss-800:#3B5A24;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--paper-100);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink-900);display:flex;justify-content:center;padding:0 0 40px;
  }
  .card{width:100%;max-width:520px;background:var(--paper-50);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08);}
  header{background:var(--ink-900);color:var(--paper-50);padding:28px 22px 20px;}
  .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#C8C3B5;display:flex;align-items:center;gap:6px;}
  header h1{font-size:24px;font-weight:900;margin:6px 0 2px;letter-spacing:-.01em;}
  header .sci{font-style:italic;font-size:13px;color:#E5E0D3;}
  main{padding:20px 22px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:16px;align-items:center;background:var(--paper-100);padding:12px 14px;border-radius:4px;border:1px solid var(--border-soft);}
  .codigo{font-family:ui-monospace,Menlo,monospace;font-size:13px;}
  .badge{font-size:10px;font-weight:700;padding:2px 6px;background:var(--moss-100);color:var(--moss-800);border-radius:3px;text-transform:uppercase;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat{background:var(--paper-0);border:1px solid var(--border-soft);border-radius:4px;padding:10px 12px;}
  .stat .lbl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);}
  .stat .val{font-size:13px;font-weight:700;margin-top:2px;}
  .cosechas{background:var(--paper-0);border:1px solid var(--border-soft);border-radius:4px;padding:12px 14px;}
  .cosechas .lbl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-bottom:8px;}
  .cosecha-item{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--border-soft);}
  .cosecha-item:first-child{border-top:none;}
  .brand{background:var(--moss-100);border:1px solid #A8C090;border-radius:4px;padding:12px 14px;font-size:11.5px;color:var(--moss-800);line-height:1.5;}
  .state{padding:60px 24px;text-align:center;color:var(--ink-500);font-size:13px;}
  footer{padding:16px 22px 0;text-align:center;font-size:11px;color:var(--ink-500);}
</style>
</head>
<body>
  <div class="card" id="app">
    <div class="state" id="loading">Cargando ficha de trazabilidad…</div>
  </div>

  <script type="module">
    import { initializeApp } from "../vendor/firebase/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy } from "../vendor/firebase/firebase-firestore.js";
    import { firebaseConfig } from "../firebase/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Acepta /trace/SDP-..., /l/SDP-..., /c/SDP-...-B01 (el sufijo -Bxx de
    // una bolsa individual se recorta: la ficha pública es por lote, no
    // por bolsa) y también ?codigo=SDP-... como respaldo.
    function extraerCodigo() {
      const params = new URLSearchParams(location.search);
      if (params.get('codigo')) return params.get('codigo');
      const parts = location.pathname.split('/').filter(Boolean);
      const raw = parts[parts.length - 1] || '';
      return raw.replace(/-B\d+$/i, '');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function diasEntre(fechaIso) {
      if (!fechaIso) return null;
      const start = new Date(fechaIso);
      if (isNaN(start)) return null;
      return Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
    }

    function render(lote, cosechas, codigo) {
      const app = document.getElementById('app');
      if (!lote) {
        app.innerHTML = `
          <header>
            <div class="eyebrow">Trazabilidad de Origen · Tenjo, Colombia</div>
            <h1>Código no encontrado</h1>
          </header>
          <div class="state">No hay una ficha pública registrada para <strong>${esc(codigo)}</strong>. Verifica el código o contacta a Setas de la Peña.</div>`;
        return;
      }
      const dias = diasEntre(lote.fechaInoculacion);
      const totalKg = cosechas.reduce((s, c) => s + (parseFloat(c.pesoFresco) || 0), 0);
      const cosechasHtml = cosechas.length
        ? cosechas.map(c => `
            <div class="cosecha-item">
              <span>Flush #${esc(c.flush || 1)} · ${esc(c.fecha || '—')}</span>
              <strong>${(parseFloat(c.pesoFresco) || 0).toFixed(0)} g${c.calidad ? ' · ' + '★'.repeat(c.calidad) : ''}</strong>
            </div>`).join('')
        : '<div class="cosecha-item">Aún sin cosechas registradas</div>';

      app.innerHTML = `
        <header>
          <div class="eyebrow">Trazabilidad de Origen · Tenjo, Colombia</div>
          <h1>${esc(lote.especie || 'Seta Cultivada')}</h1>
          <div class="sci">${esc(lote.especieCientifico || '')}</div>
        </header>
        <main>
          <div class="row">
            <div>
              <div><span class="codigo"><strong>Lote #${esc(lote.codigo)}</strong></span> <span class="badge">${esc(lote.estado || 'activo')}</span></div>
              <div style="font-size:11.5px;color:var(--ink-600);margin-top:3px;">Finca Santa Isabel · Tenjo, Cundinamarca · 2.587 msnm</div>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><div class="lbl">Inoculación</div><div class="val">${esc(lote.fechaInoculacion || '—')}</div></div>
            <div class="stat"><div class="lbl">Días en Proceso</div><div class="val">${dias != null ? dias + ' días' : '—'}</div></div>
            <div class="stat"><div class="lbl">Cosecha Total</div><div class="val">${totalKg > 0 ? (totalKg / 1000).toFixed(2) + ' kg' : 'En sala'}</div></div>
          </div>
          <div class="cosechas">
            <div class="lbl">Cosechas registradas</div>
            ${cosechasHtml}
          </div>
          <div class="brand">
            ✓ Sustrato 100% Botánico Limpio — cultivado a 2.587 msnm sin pesticidas químicos ni fertilizantes sintéticos, hidratado con agua pura de montaña y pasteurizado térmicamente.
          </div>
        </main>
        <footer>Setas de la Peña · setasdelapena.co</footer>`;
    }

    (async () => {
      const codigo = extraerCodigo();
      if (!codigo) {
        render(null, [], '');
        return;
      }
      try {
        const loteSnap = await getDoc(doc(db, 'public_lotes', codigo));
        const cosechasSnap = await getDocs(query(collection(db, 'public_lotes', codigo, 'cosechas'), orderBy('flush', 'asc')));
        const cosechas = cosechasSnap.docs.map(d => d.data());
        render(loteSnap.exists() ? loteSnap.data() : null, cosechas, codigo);
      } catch (err) {
        document.getElementById('app').innerHTML = `<div class="state">No se pudo cargar la ficha (${esc(err.message || err.code || 'error de red')}). Intenta de nuevo.</div>`;
      }
    })();
  </script>
</body>
</html>
