<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pase Gastronómico & Trazabilidad · Setas de la Peña</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../assets/tokens/swiss-botanical-tokens.css">
<style>
  :root {
    /* Alias locales de trace.html a los tokens reales de Swiss Botanical
       (field-os-simulador/setas-os/assets/tokens/swiss-botanical-tokens.css).
       No redefinir valores aquí — solo mapear los nombres que ya usa esta
       página a su token --sb-* correspondiente. */
    --paper-0: var(--sb-paper-0);
    --paper-1: var(--sb-paper-1);
    --paper-2: var(--sb-paper-2);
    --paper-3: var(--sb-paper-3);

    --ink-0: var(--sb-ink-0);
    --ink-1: var(--sb-ink-1);
    --ink-2: var(--sb-ink-2);
    --ink-3: var(--sb-ink-3);

    --line-0: var(--sb-line-hairline);
    --line-1: var(--sb-line-strong);
    --line-2: var(--sb-line-heavy);

    --accent-terracotta: var(--sb-accent-rosa);
    --accent-terracotta-dim: var(--sb-accent-rosa-tint);
    --accent-olive: var(--sb-status-active);
    --accent-olive-dim: var(--sb-status-active-tint);
    --accent-blue-grey: var(--sb-accent-orellana);

    --font-serif: var(--sb-font-serif);
    --font-sans: var(--sb-font-sans);
    --font-mono: var(--sb-font-mono);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--paper-1);
    font-family: var(--font-sans);
    color: var(--ink-0);
    display: flex;
    justify-content: center;
    padding: 24px 12px 48px;
    -webkit-font-smoothing: antialiased;
  }

  .cartouche-outer {
    width: 100%;
    max-width: 540px;
    background: var(--paper-0);
    border: 2px solid var(--line-2);
    padding: 4px;
    box-shadow: none;
    border-radius: 0px;
  }

  .cartouche-inner {
    border: 1px solid var(--line-0);
    padding: 0;
    background: var(--paper-0);
    display: flex;
    flex-direction: column;
  }

  /* Header Editorial — el acento se tiñe por especie vía --species-accent,
     fijado en línea sobre .cartouche-outer según el binomio del lote
     (ver script). Por defecto cae en el acento terracota general. */
  :root {
    --species-accent: var(--accent-terracotta);
    --species-accent-tint: var(--accent-terracotta-dim);
  }

  header {
    background: var(--ink-0);
    color: var(--paper-0);
    padding: 24px 20px 20px;
    /* --species-accent-tint (no el acento sólido): sobre --ink-0 el acento
       de Shiitake cae a 2.09:1, bajo el mínimo no-textual 3:1. */
    border-bottom: 2px solid var(--species-accent-tint);
    position: relative;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--paper-2);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .eyebrow::before {
    /* Glifo decorativo sobre fondo oscuro (--ink-0): --species-accent puro
       falla el contraste no-textual 3:1 para más de una especie (ver
       auditoría). Se usa el tinte, que siempre queda claro sobre tinta. */
    content: "■";
    font-size: 8px;
    color: var(--species-accent-tint);
  }

  header h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--paper-0);
    margin: 4px 0 2px;
  }

  header .sci {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 14px;
    color: var(--paper-2);
    opacity: 0.95;
  }

  .badge-stamp {
    /* Texto/borde fijos en --paper-0 (~15:1 sobre --ink-0, siempre legible):
       --species-accent como color de texto aquí falla 4.5:1 para las
       cuatro especies contra el fondo oscuro del header (auditado, peor
       caso 2.09:1). El acento de especie queda como lavado de fondo, que
       no tiene requisito de contraste de texto. */
    position: absolute;
    top: 20px;
    right: 20px;
    border: 1px solid var(--paper-2);
    padding: 3px 7px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--paper-0);
    background: color-mix(in srgb, var(--species-accent-tint) 22%, transparent);
  }

  main {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Secciones con cartela */
  .section-box {
    border: 1px solid var(--line-1);
    background: var(--paper-0);
    border-radius: 0px;
  }

  .section-hd {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 14px;
    background: var(--paper-1);
    border-bottom: 1px solid var(--line-1);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-1);
  }

  .section-hd .tag {
    /* --species-accent como texto pequeño sobre --paper-1 falla 4.5:1 para
       3 de 4 especies (auditado: 3.72–4.29:1). --ink-1 es el color de
       texto seguro; el acento vive en elementos no-textuales (badge, CTA). */
    color: var(--ink-1);
    font-weight: 700;
  }

  .section-body {
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Ficha de Cata */
  .tasting-lead {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-0);
  }

  .tasting-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    border-top: 1px solid var(--line-0);
    padding-top: 12px;
  }

  @media (min-width: 480px) {
    .tasting-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .tasting-item {
    background: var(--paper-1);
    border: 1px solid var(--line-0);
    padding: 10px 12px;
  }

  .tasting-item .lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
    display: block;
    margin-bottom: 4px;
  }

  .tasting-item .val {
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--ink-0);
  }

  /* Trazabilidad Agronómica */
  .lot-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper-1);
    border: 1px solid var(--line-0);
    padding: 10px 12px;
  }

  .codigo-mono {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-0);
  }

  .state-chip {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 7px;
    background: var(--accent-olive-dim);
    color: var(--accent-olive);
    border: 1px solid var(--accent-olive);
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .metric-cell {
    background: var(--paper-1);
    border: 1px solid var(--line-0);
    padding: 10px 10px;
  }

  .metric-cell .lbl {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .metric-cell .val {
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-0);
    margin-top: 4px;
  }

  .cosechas-list {
    border-top: 1px solid var(--line-0);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .cosecha-item {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 6px 8px;
    background: var(--paper-1);
    border-left: 2px solid var(--accent-olive);
  }

  .stars {
    /* Mismo motivo que .section-hd .tag: texto pequeño sobre --paper-1. */
    color: var(--ink-1);
    font-size: 11px;
    margin-left: 4px;
  }

  .guarantee-box {
    background: var(--paper-1);
    border: 1px solid var(--line-1);
    padding: 12px 14px;
    font-size: 11.5px;
    color: var(--ink-1);
    line-height: 1.5;
    position: relative;
  }

  .guarantee-box strong {
    color: var(--accent-olive);
    font-family: var(--font-mono);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: .06em;
    display: block;
    margin-bottom: 2px;
  }

  /* Culinary Market — Formato & Disponibilidad */
  .format-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .format-card {
    background: var(--paper-1);
    border: 1px solid var(--line-0);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .format-card__weight {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-0);
  }

  .format-card__desc {
    font-size: 11.5px;
    color: var(--ink-1);
  }

  .availability-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line-0);
    padding-top: 12px;
  }

  .state-chip--active {
    background: var(--accent-olive-dim);
    color: var(--accent-olive);
    border-color: var(--accent-olive);
  }

  .state-chip--warn {
    background: var(--sb-status-warn-tint);
    /* --sb-status-warn (#C49A4C) no alcanza 4.5:1 sobre su propio tinte
       (solo 2.25:1) ni 3:1 como borde — el mismo patrón de "oscurecer
       para AA" ya documentado en DESIGN_TOKENS.md (--cat-sup hover-text
       #8B6014). No revertir a --sb-status-warn aquí. */
    color: #8B6014;
    border-color: #8B6014;
  }

  .state-chip--neutral {
    background: var(--paper-2);
    /* --ink-2 sobre --paper-2 da 4.26:1, bajo el mínimo AA de 4.5:1 para
       texto pequeño — se usa --ink-1 (8.69:1) en su lugar. */
    color: var(--ink-1);
    border-color: var(--line-0);
  }

  .availability-note {
    font-size: 11.5px;
    color: var(--ink-1);
    line-height: 1.4;
  }

  .cta-button {
    /* Fondo fijo en --ink-0 (no --species-accent): algunos acentos de
       especie (ej. Melena #9D6F28) caen bajo 4.5:1 con texto --paper-0
       encima. El acento de especie se conserva como borde-izq de 4px. */
    display: block;
    text-align: center;
    background: var(--ink-0);
    color: var(--paper-0);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 12px 16px;
    border: 1px solid var(--ink-0);
    /* --species-accent-tint, no el acento sólido: sobre --ink-0 el de
       Shiitake cae a 2.09:1, bajo el mínimo no-textual 3:1 (auditado). */
    border-left: 4px solid var(--species-accent-tint);
    transition: opacity var(--sb-duration-fast, 150ms) var(--sb-ease-pressed, ease);
  }

  .cta-button:hover {
    opacity: 0.88;
  }

  footer {
    border-top: 1px solid var(--line-0);
    padding: 14px 20px 18px;
    background: var(--paper-1);
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--ink-2);
  }

  footer a {
    color: var(--ink-0);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .state-msg {
    padding: 60px 24px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-2);
  }

  /* Línea de Tiempo de Ciclo y Eventos de Trazabilidad */
  .timeline-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--line-0);
    padding-top: 10px;
  }
  .timeline-item {
    background: var(--paper-1);
    border: 1px solid var(--line-0);
    border-left: 3px solid var(--accent-olive);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .timeline-item--bag {
    border-left-color: var(--species-accent);
    background: color-mix(in srgb, var(--species-accent-tint) 15%, var(--paper-1));
  }
  .timeline-item__hd {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-2);
  }
  .timeline-item__title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-0);
  }
  .timeline-item__meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .meta-tag {
    font-family: var(--font-mono);
    font-size: 9.5px;
    padding: 1px 5px;
    background: var(--paper-0);
    border: 1px solid var(--line-0);
    color: var(--ink-1);
  }
  .meta-obs {
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-1);
    margin-top: 2px;
  }

  /* CTA Abrir en Setas OS */
  .cta-open-os {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    background: var(--ink-0);
    color: var(--paper-0);
    text-align: center;
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    border: 1px solid var(--ink-0);
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .cta-open-os:hover {
    background: var(--ink-1);
    color: var(--paper-0);
  }
</style>
</head>
<body>
  <div class="cartouche-outer">
    <div class="cartouche-inner" id="app">
      <div class="state-msg" id="loading">Recuperando certificado y pase gastronómico…</div>
    </div>
  </div>

  <script src="../trace-identity.js"></script>
  <script src="../public-trace-dto.js"></script>
  <script type="module">
    import { initializeApp } from "../vendor/firebase/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy } from "../vendor/firebase/firebase-firestore.js";
    import { firebaseConfig } from "../firebase/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PERFILES_GASTRONOMICOS = {
      'Pleurotus ostreatus': {
        comun: 'Orellana / Pleurotus',
        textura: 'Carnosa, elástica y aterciopelada al dente.',
        perfil: 'Umami sutil, notas de bosque húmedo, avellana tostada y final mineral limpio.',
        maridaje: 'Salteado vivo a fuego alto en mantequilla clarificada o hierro fundido, risottos, fondos reducidos y vino blanco seco.',
        conservacion: '3°C a 5°C en empaque respirable. No lavar antes de guardar; limpiar con brocha suave antes de cocción.'
      },
      'Lentinula edodes': {
        comun: 'Shiitake',
        textura: 'Densa, elástica y consistente, gran resistencia a cocciones prolongadas.',
        perfil: 'Profundo umami concentrado, ahumado natural, notas terrosas y sotobosque andino.',
        maridaje: 'Caldos ramen, reducciones de soja añeja, glaseados de miso, brasas directas o fondos madre.',
        conservacion: '3°C a 5°C. Desarrolla mayor profundidad aromática tras 24–48h en frío ventilado.'
      },
      'Hericium erinaceus': {
        comun: 'Melena de León',
        textura: 'Tierna y deshilachable, textura análoga a langosta o vieiras de mar.',
        perfil: 'Dulce y delicado, sutil recuerdo marino, notas de mantequilla dorada.',
        maridaje: 'Sellado en medallones a la plancha con ghee y tomillo, o crudo en carpaccio fino con AOVE.',
        conservacion: '2°C a 4°C. Manipular con extrema delicadeza para proteger las espinas fértiles.'
      },
      'Pleurotus djamor': {
        comun: 'Orellana Rosada',
        textura: 'Delicada y ligera, borde ondulado con menor grosor que la Orellana blanca.',
        perfil: 'Umami suave, notas cítricas discretas y final ligeramente ahumado tras cocción.',
        maridaje: 'Salteado breve a fuego alto para conservar el color; pierde tono rosado con cocciones largas.',
        conservacion: '3°C a 5°C en empaque respirable. Consumir dentro de las primeras 48h para conservar el color.'
      },
      'default': {
        comun: 'Seta Gourmet de Altura',
        textura: 'Firme, carnosa y de alta absorción aromática.',
        perfil: 'Umami fresco, limpio y fragante, característico de la altitud de Tenjo (2.592 msnm).',
        maridaje: 'Cocción corta a temperatura media-alta con hierbas frescas, pastas artesanales o guarniciones de autor.',
        conservacion: '3°C a 5°C en refrigeración ventilada.'
      }
    };

    const SCAN_CODE_PARAMS = ['codigo', 'code', 'lote', 'batch'];
    const CRATE_CODE_PARAMS = ['crate', 'canastilla'];

    function extraerParametros() {
      let rawCode = '';
      let flush = null;
      let isCrate = false;

      try {
        const search = new URLSearchParams(location.search);
        const presentValues = new Set();
        for (const key of SCAN_CODE_PARAMS) {
          const val = search.get(key);
          if (val) {
            const clean = val.replace(/^(?:setas:(?:lote|bag|bolsa|crate):|SDP-CERT-)/i, '').trim();
            if (clean) presentValues.add(clean);
          }
        }
        for (const key of CRATE_CODE_PARAMS) {
          const val = search.get(key);
          if (val) {
            const clean = val.replace(/^(?:setas:crate:)/i, '').trim();
            if (clean) presentValues.add(clean);
          }
        }
        // Si hay parámetros en conflicto con valores distintos (e.g. ?codigo=LOT-1&batch=LOT-2), rechazar
        if (presentValues.size > 1) {
          return { codigo: '', flush: null, error: 'conflicting_parameters' };
        }
        if (presentValues.size === 1) {
          // Precedencia determinista: codigo > code > lote > batch > crate > canastilla
          for (const key of SCAN_CODE_PARAMS) {
            const val = search.get(key);
            if (val) {
              rawCode = val;
              break;
            }
          }
          if (!rawCode) {
            for (const key of CRATE_CODE_PARAMS) {
              const val = search.get(key);
              if (val) {
                rawCode = val;
                isCrate = true;
                break;
              }
            }
          }
        }

        // Validación estricta de flush: entero positivo 1 a 99
        const flushVal = search.get('flush');
        if (flushVal && /^[1-9]\d{0,1}$/.test(flushVal.trim())) {
          flush = parseInt(flushVal.trim(), 10);
        }
      } catch (e) {}

      // Fallback por ruta limpia: /c/<codigo> o /trace/<codigo>
      if (!rawCode) {
        try {
          const segments = location.pathname.split('/').filter(Boolean);
          if (segments.length >= 2) {
            const prev = segments[segments.length - 2].toLowerCase();
            if (prev === 'c' || prev === 'trace') {
              const last = decodeURIComponent(segments[segments.length - 1]).trim();
              if (last && !last.endsWith('.html')) {
                rawCode = last;
              }
            }
          }
        } catch (e) {}
      }

      if (!rawCode) return { codigo: '', flush: null, isCrate: false, error: null };

      // Normalizar: strip de esquemas conocidos y sanitización estricta [A-Za-z0-9_-]{1,64}
      const cleaned = rawCode.replace(/^(?:setas:(?:lote|bag|bolsa|crate):|SDP-CERT-)/i, '').trim();
      if (!/^[A-Za-z0-9_-]{1,64}$/.test(cleaned)) {
        return { codigo: '', flush: null, error: 'invalid_characters' };
      }
      if (/^CAN-\d+/i.test(cleaned)) {
        isCrate = true;
      }
      return { codigo: cleaned, flush, isCrate, error: null };
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function diasEntre(fechaIso) {
      if (!fechaIso) return null;
      const start = new Date(fechaIso);
      if (isNaN(start)) return null;
      return Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
    }

    function obtenerPerfil(especie, cientifico) {
      return PERFILES_GASTRONOMICOS[cientifico] || PERFILES_GASTRONOMICOS[especie] || PERFILES_GASTRONOMICOS['default'];
    }

    // Acento cromático por especie (SOURCES.md #5 Taboocha: "codificación
    // cromática vibrante pero disciplinada para diferenciar perfiles
    // organolépticos entre variedades hermanas"). Referencian los tokens
    // reales de assets/tokens/swiss-botanical-tokens.css.
    const ACENTO_POR_ESPECIE = {
      'Lentinula edodes':    { accent: 'var(--sb-accent-shiitake)',  tint: 'var(--sb-accent-shiitake-tint)' },
      'Pleurotus ostreatus': { accent: 'var(--sb-accent-orellana)',  tint: 'var(--sb-accent-orellana-tint)' },
      'Hericium erinaceus':  { accent: 'var(--sb-accent-melena)',    tint: 'var(--sb-accent-melena-tint)' },
      'Pleurotus djamor':    { accent: 'var(--sb-accent-rosa)',      tint: 'var(--sb-accent-rosa-tint)' }
    };

    function obtenerAcento(cientifico) {
      return ACENTO_POR_ESPECIE[cientifico] || { accent: 'var(--accent-terracotta)', tint: 'var(--accent-terracotta-dim)' };
    }

    // Disponibilidad de venta según el estado real del lote (ver
    // batch-traceability.js / public-trace-sync.js: incubacion,
    // fructificacion, completado). No se inventan calendarios de despacho
    // no confirmados — solo el estado verificado del lote.
    const DISPONIBILIDAD_POR_ESTADO = {
      'incubacion':     { label: 'En incubación · aún no disponible', tone: 'warn' },
      'fructificacion': { label: 'Cosecha activa · disponible',       tone: 'active' },
      'completado':     { label: 'Ciclo completado',                 tone: 'neutral' }
    };

    function obtenerDisponibilidad(estado) {
      return DISPONIBILIDAD_POR_ESTADO[estado] || { label: estado || 'Sin estado', tone: 'neutral' };
    }

    function render(lote, cosechas, codigo, bagInfo = null, targetFlush = null) {
      const app = document.getElementById('app');
      if (!lote) {
        const bagNum = bagInfo ? bagInfo.replace(/^B/i, '') : null;
        app.innerHTML = `
          <header>
            <div class="badge-stamp">${bagInfo ? `Bolsa #${esc(bagNum)}` : 'Lote'}</div>
            <div class="eyebrow">Trazabilidad de Origen · Tenjo, Colombia</div>
            <h1>${esc(codigo)}</h1>
            <div class="sci">Ficha Provisional · En Proceso de Publicación</div>
          </header>
          <main>
            <div class="section-box">
              <div class="section-hd">
                <span>Estado de Trazabilidad</span>
                <span class="tag">Ficha Provisional</span>
              </div>
              <div class="section-body">
                <p class="tasting-lead">
                  El código escaneado <strong>${esc(codigo)}</strong> corresponde a una unidad de cultivo de Setas de la Peña en Tenjo, Colombia (2.592 msnm).
                </p>
                <div class="lot-row">
                  <div>
                    <div class="codigo-mono">${esc(codigo)}</div>
                    <div style="font-size:11px;color:var(--ink-2);margin-top:2px;">Finca Santa Isabel · Serranía de Juaica${bagInfo ? ` · Bolsa individual ${esc(bagInfo)}` : ''}</div>
                  </div>
                  <div class="state-chip state-chip--warn">Pendiente de Sincronización</div>
                </div>
                <p style="font-size:12px;color:var(--ink-1);line-height:1.5;">
                  La ficha pública detallada aún no ha sido sincronizada a la nube para este lote. Si formas parte del equipo operativo de Setas de la Peña, puedes consultar y registrar eventos directamente en Setas OS.
                </p>
              </div>
            </div>

            <a class="cta-open-os" href="../Setas%20OS%20v5.dc.html?view=bitacora&lote=${encodeURIComponent(codigo)}${bagInfo ? `&bolsa=${encodeURIComponent(bagInfo)}` : ''}">
              Abrir registro operativo en Setas OS &rarr;
            </a>
          </main>
          <footer>
            Setas de la Peña · Sabana Centro, Colombia<br>
            <a href="https://setasdelapena.co">setasdelapena.co</a> · <span style="font-family:var(--font-mono);">FOS v3.0</span>
          </footer>`;
        return;
      }

      const perfil = obtenerPerfil(lote.especie, lote.especieCientifico);
      const dias = diasEntre(lote.fechaInoculacion);
      const totalKg = cosechas.reduce((s, c) => s + (parseFloat(c.pesoFresco) || 0), 0);
      const acento = obtenerAcento(lote.especieCientifico);
      const disponibilidad = obtenerDisponibilidad(lote.estado);

      app.style.setProperty('--species-accent', acento.accent);
      app.style.setProperty('--species-accent-tint', acento.tint);

      const cosechasHtml = cosechas.length
        ? cosechas.map(c => {
            const calidad = Math.max(0, Math.min(5, Math.floor(Number(c.calidad)) || 0));
            const stars = calidad > 0 ? `<span class="stars">${'★'.repeat(calidad)}</span>` : '';
            const isTarget = targetFlush && Number(c.flush) === targetFlush;
            return `
            <div class="cosecha-item" ${isTarget ? 'style="border-left:3px solid var(--species-accent);background:var(--species-accent-tint);padding-left:10px;"' : ''}>
              <span>Flush #${esc(c.flush || 1)} · ${esc(c.fecha || '—')}${isTarget ? ' <strong style="font-size:10px;text-transform:uppercase;color:var(--species-accent);">(Esta entrega)</strong>' : ''}</span>
              <strong>${(parseFloat(c.pesoFresco) || 0).toFixed(0)} g ${stars}</strong>
            </div>`;
          }).join('')
        : '<div class="cosecha-item" style="color:var(--ink-2);">Cosecha en desarrollo en sala de fructificación</div>';

      const rawEvents = Array.isArray(lote.lifecycleEvents) ? lote.lifecycleEvents : [];
      const eventsHtml = rawEvents.length
        ? rawEvents.map(ev => {
            const isBagEvent = Boolean(ev.bagId || ev.scope === 'bag');
            const metaTags = [];
            if (ev.meta?.temperatura != null) metaTags.push(`${ev.meta.temperatura}°C`);
            if (ev.meta?.humedad != null) metaTags.push(`${ev.meta.humedad}% HR`);
            if (ev.meta?.co2 != null) metaTags.push(`${ev.meta.co2} ppm CO2`);
            if (ev.meta?.tipoInspeccion) metaTags.push(esc(ev.meta.tipoInspeccion));
            if (ev.meta?.resultadoInspeccion) metaTags.push(esc(ev.meta.resultadoInspeccion));
            if (ev.meta?.flush) metaTags.push(`Flush ${ev.meta.flush}`);
            if (ev.meta?.fase) metaTags.push(esc(ev.meta.fase));

            const obs = ev.meta?.observacionPublica
              ? `<div class="meta-obs">“${esc(ev.meta.observacionPublica)}”</div>`
              : '';

            return `
              <div class="timeline-item ${isBagEvent ? 'timeline-item--bag' : ''}">
                <div class="timeline-item__hd">
                  <span>${esc(ev.stage ? ev.stage.toUpperCase() : 'CICLO')}</span>
                  <span>${esc(ev.at ? ev.at.slice(0, 16).replace('T', ' ') : '—')}</span>
                </div>
                <div class="timeline-item__title">
                  ${esc(ev.title || ev.type || 'Evento')}
                  ${isBagEvent ? `<span class="meta-tag" style="margin-left:6px;border-color:var(--species-accent);">Bolsa ${esc(ev.bagId ? ev.bagId.replace(/^.*-B/i, 'B') : '')}</span>` : ''}
                </div>
                ${metaTags.length ? `<div class="timeline-item__meta">${metaTags.map(m => `<span class="meta-tag">${m}</span>`).join('')}</div>` : ''}
                ${obs}
              </div>`;
          }).join('')
        : '<div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);padding:6px 0;">Ciclo agronómico registrado en salas de cultivo de Tenjo, Colombia.</div>';

      app.innerHTML = `
        <header>
          <div class="badge-stamp">${bagInfo ? `Bolsa #${esc(bagInfo.replace(/^B/i, ''))}` : 'Cosecha de Autor'}</div>
          <div class="eyebrow">Tenjo, Colombia · 2.592 msnm · Sabana Centro</div>
          <h1>${esc(lote.especie || 'Seta Cultivada')}</h1>
          <div class="sci">${esc(lote.especieCientifico || perfil.comun)}</div>
        </header>

        <main>
          <!-- ENLACE OPERATIVO DIRECTO HACIA SETAS OS -->
          <a class="cta-open-os" href="../Setas%20OS%20v5.dc.html?view=bitacora&lote=${encodeURIComponent(lote.codigo)}${bagInfo ? `&bolsa=${encodeURIComponent(bagInfo)}` : ''}">
            Abrir registro operativo en Setas OS &rarr;
          </a>

          <!-- BLOQUE 1: PASE GASTRONÓMICO / FICHA PARA CHEF -->
          <div class="section-box">
            <div class="section-hd">
              <span>Pase Gastronómico</span>
              <span class="tag">Perfil de Cocina</span>
            </div>
            <div class="section-body">
              <p class="tasting-lead">
                <strong>Textura & Carácter:</strong> ${esc(perfil.textura)}
              </p>
              <div class="tasting-grid">
                <div class="tasting-item">
                  <span class="lbl">Perfil Organoléptico</span>
                  <div class="val">${esc(perfil.perfil)}</div>
                </div>
                <div class="tasting-item">
                  <span class="lbl">Técnica & Maridaje</span>
                  <div class="val">${esc(perfil.maridaje)}</div>
                </div>
              </div>
              <div class="tasting-item" style="background:var(--paper-0);border:1px dashed var(--line-0);">
                <span class="lbl">Conservación en Cocina</span>
                <div class="val" style="font-size:12px;color:var(--ink-1);">${esc(perfil.conservacion)}</div>
              </div>
            </div>
          </div>

          <!-- BLOQUE 1.5: FORMATO & DISPONIBILIDAD (Culinary Market) -->
          <div class="section-box">
            <div class="section-hd">
              <span>Formato & Disponibilidad</span>
              <span class="tag">Cómo Pedirlo</span>
            </div>
            <div class="section-body">
              <div class="format-grid">
                <div class="format-card">
                  <span class="format-card__weight">200 g</span>
                  <span class="format-card__desc">Cena para 1–2 personas</span>
                </div>
                <div class="format-card">
                  <span class="format-card__weight">400 g</span>
                  <span class="format-card__desc">Cocina familiar, 3–4 porciones</span>
                </div>
              </div>
              <div class="availability-row">
                <span class="state-chip state-chip--${disponibilidad.tone}">${esc(disponibilidad.label)}</span>
                <span class="availability-note">Escríbenos para confirmar disponibilidad y fecha de entrega de este lote.</span>
              </div>
            </div>
          </div>

          <!-- BLOQUE 2: TRAZABILIDAD AGRONÓMICA -->
          <div class="section-box">
            <div class="section-hd">
              <span>Ficha Técnica de Origen</span>
              <span>Lote #${esc(lote.codigo)}${bagInfo ? ` · Bolsa #${esc(bagInfo.replace(/^B/i, ''))}` : ''}</span>
            </div>
            <div class="section-body">
              <div class="lot-row">
                <div>
                  <div class="codigo-mono">${esc(codigo || lote.codigo)}</div>
                  <div style="font-size:11px;color:var(--ink-2);margin-top:2px;">Finca Santa Isabel · Serranía de Juaica${bagInfo ? ` · Bolsa individual ${esc(bagInfo)}` : ''}</div>
                </div>
                <div class="state-chip state-chip--${disponibilidad.tone}">${esc(disponibilidad.label)}</div>
              </div>

              <div class="metrics-grid">
                <div class="metric-cell">
                  <div class="lbl">Inoculación</div>
                  <div class="val">${esc(lote.fechaInoculacion || '—')}</div>
                </div>
                <div class="metric-cell">
                  <div class="lbl">Días de Ciclo</div>
                  <div class="val">${dias != null ? dias + ' d' : '—'}</div>
                </div>
                <div class="metric-cell">
                  <div class="lbl">Cosecha Total</div>
                  <div class="val">${totalKg > 0 ? (totalKg / 1000).toFixed(2) + ' kg' : 'En sala'}</div>
                </div>
              </div>

              <div class="cosechas-list">
                <div style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px;">Registro de Cosechas por Flush</div>
                ${cosechasHtml}
              </div>

              <div class="guarantee-box">
                <strong>Garantía Botánica Limpia</strong>
                Cultivado en el clima frío de la Sabana de Bogotá (Tenjo, 2.592 msnm), con control ambiental en sala de fructificación y sustrato formulado con subproductos agrícolas locales, sin pesticidas químicos ni fertilizantes sintéticos.
              </div>
            </div>
          </div>

          <!-- BLOQUE 2.5: REGISTRO DE EVENTOS Y TRAZABILIDAD DE CICLO -->
          <div class="section-box">
            <div class="section-hd">
              <span>Registro de Eventos de Ciclo</span>
              <span class="tag">${bagInfo ? `Bolsa #${esc(bagInfo.replace(/^B/i, ''))}` : 'Bitácora'}</span>
            </div>
            <div class="section-body">
              <div style="font-size:12px;color:var(--ink-1);line-height:1.4;">
                Eventos inmutables verificados en sala y reportados mediante captura digital en granja.
              </div>
              <div class="timeline-list">
                ${eventsHtml}
              </div>
            </div>
          </div>

          <!-- BLOQUE 3: PRÓXIMO PASO (Culinary Market) -->
          <a class="cta-button" href="mailto:info@setasdelapena.co?subject=${encodeURIComponent('Consulta lote ' + (lote.codigo || ''))}">
            Escríbenos por este lote &rarr;
          </a>
        </main>

        <footer>
          Setas de la Peña · Sabana Centro, Colombia<br>
          <a href="https://setasdelapena.co">setasdelapena.co</a> · <span style="font-family:var(--font-mono);">FOS v3.0</span>
        </footer>`;
    }

    function renderCrate(crateCode) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <header>
          <div class="badge-stamp">Canastilla</div>
          <div class="eyebrow">Activo de Cosecha · Tenjo, Colombia</div>
          <h1>Canastilla de Cosecha</h1>
          <div class="sci">${esc(crateCode)}</div>
        </header>

        <main>
          <div class="section-box">
            <div class="section-hd">
              <span>Identidad Operativa</span>
              <span class="tag">Báscula Continua</span>
            </div>
            <div class="section-body">
              <p class="tasting-lead">
                Contenedor plástico grado alimentario para recolección en sala de fructificación y pesaje continuo en Setas OS.
              </p>
              <div class="lot-row">
                <span class="lbl">Identificador</span>
                <span class="codigo-mono">${esc(crateCode)}</span>
              </div>
              <div class="lot-row">
                <span class="lbl">Uso en Granja</span>
                <span class="val">Corte y pesaje de flushes</span>
              </div>
            </div>
          </div>

          <a class="cta-open-os" href="../Setas%20OS%20v5.dc.html?view=inventario&crate=${encodeURIComponent(crateCode)}">
            Abrir canastilla en Setas OS &rarr;
          </a>
        </main>

        <footer>
          Setas de la Peña · Sabana Centro, Colombia<br>
          <a href="https://setasdelapena.co">setasdelapena.co</a> · <span style="font-family:var(--font-mono);">FOS v3.0</span>
        </footer>`;
    }

    (async () => {
      const { codigo, flush, isCrate, error } = extraerParametros();
      if (error === 'conflicting_parameters') {
        document.getElementById('app').innerHTML = `
          <header>
            <div class="eyebrow">Trazabilidad de Origen · Tenjo, Colombia</div>
            <h1>Enlace no válido</h1>
          </header>
          <div class="state-msg">
            El enlace escaneado contiene parámetros en conflicto.<br>
            Verifica el código impreso en la etiqueta térmica.
          </div>
          <footer>Setas de la Peña · <a href="https://setasdelapena.co">setasdelapena.co</a></footer>`;
        return;
      }
      if (error === 'invalid_characters') {
        document.getElementById('app').innerHTML = `
          <header>
            <div class="eyebrow">Trazabilidad de Origen · Tenjo, Colombia</div>
            <h1>Código no válido</h1>
          </header>
          <div class="state-msg">
            El código contiene caracteres no permitidos.<br>
            Verifica la etiqueta térmica.
          </div>
          <footer>Setas de la Peña · <a href="https://setasdelapena.co">setasdelapena.co</a></footer>`;
        return;
      }
      if (!codigo) {
        render(null, [], '');
        return;
      }
      if (isCrate || /^CAN-\d+/i.test(codigo)) {
        renderCrate(codigo);
        return;
      }
      try {
        let loteCodigo = codigo;
        let bagInfo = null;

        // 1. Consulta directa por el código exacto primero
        let loteSnap = await getDoc(doc(db, 'public_lotes', loteCodigo));

        // 2. Si no existe exactamente, verificar si coincide con el patrón canónico de bolsa: <lote>-B<num>
        if (!loteSnap.exists()) {
          const bagMatch = codigo.match(/^([A-Za-z0-9_-]+)-B(\d{2,4})$/i);
          if (bagMatch) {
            const parentCode = bagMatch[1];
            const bagNum = bagMatch[2];
            const parentSnap = await getDoc(doc(db, 'public_lotes', parentCode));
            if (parentSnap.exists()) {
              loteSnap = parentSnap;
              loteCodigo = parentCode;
              bagInfo = `B${bagNum}`;
            }
          }
        }

        // 3. Fallback local oportunista (en caso de offline o mismo origen durante pruebas)
        if (!loteSnap.exists()) {
          try {
            const rawLocal = localStorage.getItem('sdp_bit_lotes');
            if (rawLocal) {
              const localLotes = JSON.parse(rawLocal);
              const foundLocal = localLotes.find(l => String(l.codigo || '').toUpperCase() === loteCodigo.toUpperCase() || l.id === loteCodigo);
              if (foundLocal) {
                let localCosechas = [];
                try {
                  const rawCos = localStorage.getItem('sdp_bit_cosechas');
                  if (rawCos) {
                    localCosechas = JSON.parse(rawCos).filter(c => c.loteId === foundLocal.id);
                  }
                } catch (_) {}
                let localBolsas = [];
                try {
                  const rawBolsas = localStorage.getItem('sdp_bit_bolsas');
                  if (rawBolsas) {
                    localBolsas = JSON.parse(rawBolsas).filter(b => b.loteId === foundLocal.id || b.loteCodigo === foundLocal.codigo);
                  }
                } catch (_) {}
                const safeDoc = (window.SetasPublicTraceDTO && typeof window.SetasPublicTraceDTO.buildPublicTraceDocument === 'function')
                  ? window.SetasPublicTraceDTO.buildPublicTraceDocument(foundLocal, localCosechas, localBolsas)
                  : foundLocal;
                render(safeDoc, safeDoc.harvests || localCosechas, codigo, bagInfo, flush);
                return;
              }
            }
          } catch (_) {}
        }

        let cosechas = [];
        if (loteSnap.exists()) {
          const data = loteSnap.data();
          if (Array.isArray(data.harvests) && data.harvests.length > 0) {
            cosechas = data.harvests;
          } else {
            const cosechasSnap = await getDocs(query(collection(db, 'public_lotes', loteCodigo, 'cosechas'), orderBy('flush', 'asc')));
            cosechas = cosechasSnap.docs.map(d => d.data());
          }
        }

        render(loteSnap.exists() ? loteSnap.data() : null, cosechas, codigo, bagInfo, flush);
      } catch (err) {
        const isOffline = !navigator.onLine || (err && (err.code === 'unavailable' || String(err.message).includes('offline')));
        document.getElementById('app').innerHTML = `
          <header>
            <div class="eyebrow">Trazabilidad de Origen · Tenjo, Colombia</div>
            <h1>${isOffline ? 'Sin conexión a internet' : 'Error de consulta'}</h1>
          </header>
          <div class="state-msg">
            ${isOffline
              ? 'La consulta de trazabilidad pública en vivo requiere conexión de datos activa.<br>Por favor reconéctate y vuelve a escanear la etiqueta.'
              : `Error consultando ficha técnica pública (${esc(err.message || err.code || 'error de red')}).<br>Por favor reintenta en unos minutos.`}
          </div>
          <footer>Setas de la Peña · <a href="https://setasdelapena.co">setasdelapena.co</a></footer>`;
      }
    })();
  </script>
</body>
</html>
