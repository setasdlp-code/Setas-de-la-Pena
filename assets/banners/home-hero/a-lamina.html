<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero A · Lámina</title>
  <link rel="stylesheet" href="hero.css">
</head>
<body>
  <section class="hero hero--lamina" aria-labelledby="hero-title">
    <div class="hero-copy">
      <p class="kicker">Tenjo · Cundinamarca · Colombia</p>
      <h1 class="title" id="hero-title">Del micelio <em>a la mesa.</em></h1>
      <p class="descriptor">Hongos para cocinar con criterio. Conocer la seta, imaginar el plato.</p>
      <a class="cta" href="/shiitake#producto">Consultar disponibilidad <span aria-hidden="true">↗</span></a>
    </div>
    <div class="lamina-plates">
      <figure>
        <img src="../../species/shiitake.png" alt="Grabado de shiitake">
        <figcaption><p class="sp-name">Shiitake</p><p class="sp-latin">Lentinula edodes</p></figcaption>
      </figure>
      <figure>
        <img src="../../species/lions_mane.png" alt="Grabado de melena de león">
        <figcaption><p class="sp-name">Melena de león</p><p class="sp-latin">Hericium erinaceus</p></figcaption>
      </figure>
      <figure>
        <img src="../../species/p_eryngii.png" alt="Grabado de eryngii">
        <figcaption><p class="sp-name">Eryngii</p><p class="sp-latin">Pleurotus eryngii</p></figcaption>
      </figure>
      <p class="caption lamina-foot">Ilustraciones de especie</p>
    </div>
  </section>
</body>
</html>
