<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero C · Lámina y plato</title>
  <link rel="stylesheet" href="hero.css">
</head>
<body>
  <section class="hero hero--par" aria-labelledby="hero-title">
    <div class="par-panel">
      <p class="kicker">Tenjo · Cundinamarca · Colombia</p>
      <h1 class="title" id="hero-title">Del micelio <em>a la mesa.</em></h1>
      <p class="descriptor">Hongos para cocinar con criterio. Conocer la seta, imaginar el plato.</p>
      <a class="cta" href="/shiitake#producto">Consultar disponibilidad <span aria-hidden="true">↗</span></a>
    </div>
    <div class="par-pair">
      <figure class="seta">
        <img src="../../species/shiitake.png" alt="Grabado de shiitake">
        <figcaption><span class="caption">La seta</span><p class="sp-name">Shiitake</p><p class="sp-latin">Lentinula edodes</p></figcaption>
      </figure>
      <div class="par-link" aria-hidden="true"><span>Una receta</span><i></i></div>
      <figure class="plato">
        <img src="../../illustrations/culinary/arepa-shiitake-gouache.webp" alt="Ilustración de una arepa con shiitake, aguacate y maíz">
        <figcaption><span class="caption">El plato · Ilustración culinaria</span><p class="sp-name">Arepa con shiitake</p><p class="sp-latin" style="font-style:normal;font-family:var(--font-sans)">Maíz dorado y aguacate</p></figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
