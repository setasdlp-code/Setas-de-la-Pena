<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero B · Platos (carrusel)</title>
  <link rel="stylesheet" href="hero.css">
  <link rel="stylesheet" href="hero-carousel.css">
  <script src="hero-carousel.js" defer></script>
</head>
<body>
  <section class="hero hero--plato hero--carousel" aria-labelledby="hero-title">
    <div class="hero-copy">
      <p class="kicker">Tenjo · Cundinamarca · Colombia</p>
      <h1 class="title" id="hero-title">Del micelio <em>a la mesa.</em></h1>
      <p class="descriptor">Hongos para cocinar con criterio. Conocer la seta, imaginar el plato.</p>
      <a class="cta" href="/shiitake#producto">Consultar disponibilidad <span aria-hidden="true">↗</span></a>
    </div>

    <div class="dish-carousel" aria-roledescription="carrusel" aria-label="Platos con nuestras setas" data-interval="6500">
      <div class="dish-track">
        <figure class="dish is-active" aria-roledescription="diapositiva" aria-label="1 de 6">
          <img src="../../illustrations/culinary/arepa-shiitake-gouache.webp" alt="Ilustración de una arepa con shiitake, aguacate y maíz" width="1254" height="1254" fetchpriority="high">
          <p class="plato-note"><b>Shiitake</b><i>Lentinula edodes</i></p>
          <figcaption>
            <p class="sp-name">Arepa de shiitake, maíz dorado y aguacate</p>
            <p class="dish-line">Maíz en dos texturas y shiitake salteado.</p>
            <p class="dish-meta"><span class="caption">Ilustración culinaria · Receta en adaptación</span><a class="dish-link" href="/recetas#receta-arepa">Ver receta <span aria-hidden="true">↗</span></a></p>
          </figcaption>
        </figure>
        <figure class="dish" aria-roledescription="diapositiva" aria-label="2 de 6">
          <img src="../../illustrations/culinary/encocado-melena-gouache.webp" alt="Ilustración de un encocado de melena de león con patacones" width="1254" height="1254" loading="lazy">
          <p class="plato-note"><b>Melena de león</b><i>Hericium erinaceus</i></p>
          <figcaption>
            <p class="sp-name">Encocado con chillangua y patacones</p>
            <p class="dish-line">Gajos dorados de melena, leche de coco y hogao.</p>
            <p class="dish-meta"><span class="caption">Ilustración culinaria · Receta en adaptación</span><a class="dish-link" href="/recetas-melena#melena-encocado">Ver receta <span aria-hidden="true">↗</span></a></p>
          </figcaption>
        </figure>
        <figure class="dish" aria-roledescription="diapositiva" aria-label="3 de 6">
          <img src="../../illustrations/culinary/chuzos-eryngii-gouache.webp" alt="Ilustración de chuzos de eryngii glaseados sobre arepa blanca" width="1254" height="1254" loading="lazy">
          <p class="plato-note"><b>Eryngii</b><i>Pleurotus eryngii</i></p>
          <figcaption>
            <p class="sp-name">Chuzos con panela y limón mandarino</p>
            <p class="dish-line">Cintas de eryngii glaseadas, sobre arepa blanca.</p>
            <p class="dish-meta"><span class="caption">Ilustración culinaria · Receta en adaptación</span><a class="dish-link" href="/recetas-eryngii#eryngii-chuzos">Ver receta <span aria-hidden="true">↗</span></a></p>
          </figcaption>
        </figure>
        <figure class="dish" aria-roledescription="diapositiva" aria-label="4 de 6">
          <img src="../../illustrations/culinary/sopa-shiitake-gouache.webp" alt="Ilustración de una sopa de coco con shiitake" width="1254" height="1254" loading="lazy">
          <p class="plato-note"><b>Shiitake</b><i>Lentinula edodes</i></p>
          <figcaption>
            <p class="sp-name">Sopa de shiitake, coco y jengibre</p>
            <p class="dish-line">Leche de coco, jengibre, limón y cilantro.</p>
            <p class="dish-meta"><span class="caption">Ilustración culinaria · Receta en adaptación</span><a class="dish-link" href="/recetas#receta-sopa">Ver receta <span aria-hidden="true">↗</span></a></p>
          </figcaption>
        </figure>
        <figure class="dish" aria-roledescription="diapositiva" aria-label="5 de 6">
          <img src="../../illustrations/culinary/posta-melena-gouache.webp" alt="Ilustración de melena de león prensada con salsa oscura" width="1254" height="1254" loading="lazy">
          <p class="plato-note"><b>Melena de león</b><i>Hericium erinaceus</i></p>
          <figcaption>
            <p class="sp-name">Melena prensada con salsa oscura</p>
            <p class="dish-line">Panela, plátano maduro y queso costeño.</p>
            <p class="dish-meta"><span class="caption">Ilustración culinaria · Receta en adaptación</span><a class="dish-link" href="/recetas-melena#melena-posta">Ver receta <span aria-hidden="true">↗</span></a></p>
          </figcaption>
        </figure>
        <figure class="dish" aria-roledescription="diapositiva" aria-label="6 de 6">
          <img src="../../illustrations/culinary/tartaletas-pipian-eryngii-gouache.webp" alt="Ilustración de tartaletas de maíz con eryngii y ají de maní" width="1254" height="1254" loading="lazy">
          <p class="plato-note"><b>Eryngii</b><i>Pleurotus eryngii</i></p>
          <figcaption>
            <p class="sp-name">Tartaletas de maíz con pipián</p>
            <p class="dish-line">Dados de eryngii, papa y maní en canastilla de maíz.</p>
            <p class="dish-meta"><span class="caption">Ilustración culinaria · Receta en adaptación</span><a class="dish-link" href="/recetas-eryngii#eryngii-pipian">Ver receta <span aria-hidden="true">↗</span></a></p>
          </figcaption>
        </figure>
      </div>

      <div class="dish-controls">
        <button class="dish-btn dish-pause" type="button" aria-label="Pausar el carrusel"><span aria-hidden="true" class="ico-pause"></span></button>
        <div class="dish-dots" role="group" aria-label="Elegir plato"></div>
        <span class="dish-count caption" aria-hidden="true"><b>01</b> / 06</span>
        <button class="dish-btn dish-prev" type="button" aria-label="Plato anterior"><span aria-hidden="true">←</span></button>
        <button class="dish-btn dish-next" type="button" aria-label="Plato siguiente"><span aria-hidden="true">→</span></button>
      </div>
      <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </div>
  </section>
</body>
</html>
