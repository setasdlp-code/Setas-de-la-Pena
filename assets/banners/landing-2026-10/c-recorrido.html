<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero C · Recorrido</title>
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <section class="hero hero--ruta" aria-labelledby="hero-title">
    <div class="ruta-head">
      <div>
        <p class="kicker">Tenjo · Cundinamarca · Colombia</p>
        <h1 class="title" id="hero-title">Del micelio <em>a la mesa.</em></h1>
      </div>
      <div class="ruta-side">
        <p class="descriptor">Hongos para cocinar con criterio. Conocer la seta. Imaginar el plato.</p>
        <a class="cta" href="#coleccion">Explorar las setas <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="ruta-steps">
      <figure>
        <p class="label"><b>01</b> · El proyecto</p>
        <div class="art"><img class="ink" src="../../la-pena-paisaje.webp" alt="Dibujo a lápiz de una peña de roca en columnas sobre laderas con árboles"></div>
        <figcaption><p class="sp-name">Desde Tenjo</p><p class="label">Cundinamarca</p></figcaption>
      </figure>
      <figure>
        <p class="label"><b>02</b> · La seta</p>
        <div class="art"><img src="../../../08_brand/ds-2026/assets/img/species/shiitake.png" alt="Ilustración de shiitake"></div>
        <figcaption><p class="sp-name">Shiitake</p><p class="sp-latin">Lentinula edodes</p></figcaption>
      </figure>
      <figure>
        <p class="label"><b>03</b> · El plato</p>
        <div class="art"><img class="plate" src="../../illustrations/culinary/arepa-shiitake-gouache.webp" alt="Ilustración culinaria de una arepa con shiitake, maíz y aguacate"></div>
        <figcaption><p class="sp-name">Arepa con shiitake</p><p class="label">Ilustración culinaria</p></figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
