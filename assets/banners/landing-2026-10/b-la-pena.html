<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero B · La peña</title>
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <section class="hero hero--pena" aria-labelledby="hero-title">
    <div class="pena-copy">
      <p class="kicker">Tenjo · Cundinamarca · Colombia</p>
      <h1 class="title" id="hero-title">Del micelio <em>a la mesa.</em></h1>
      <p class="descriptor">Hongos para cocinar con criterio. Conocer la seta. Imaginar el plato.</p>
      <div><a class="cta" href="#coleccion">Explorar las setas <span aria-hidden="true">↗</span></a></div>
    </div>
    <div class="pena-visual">
      <figure class="pena-land">
        <img class="ink" src="../../la-pena-paisaje.webp" alt="Dibujo a lápiz de una peña de roca en columnas sobre laderas con árboles">
        <figcaption class="label">Dibujo a lápiz · <b>La peña</b></figcaption>
      </figure>
      <div class="pena-row" aria-label="Láminas de especies">
        <figure><img src="../../../08_brand/ds-2026/assets/img/species/shiitake.png" alt="Ilustración de shiitake"><figcaption><p class="sp-name">Shiitake</p><p class="sp-latin">Lentinula edodes</p></figcaption></figure>
        <figure><img src="../../../08_brand/ds-2026/assets/img/species/lions-mane.png" alt="Ilustración de melena de león"><figcaption><p class="sp-name">Melena de león</p><p class="sp-latin">Hericium erinaceus</p></figcaption></figure>
        <figure><img src="../../../08_brand/ds-2026/assets/img/species/cardo.png" alt="Ilustración de eryngii"><figcaption><p class="sp-name">Eryngii</p><p class="sp-latin">Pleurotus eryngii</p></figcaption></figure>
      </div>
    </div>
  </section>
</body>
</html>
