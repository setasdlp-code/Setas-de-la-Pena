claim_disposition:
  retained_as_design_context:
    - cool exterior air may be useful during some operating windows
    - nocturnal heat loss is a relevant incubation risk
    - condensation and cap wetness require active management
    - filtration and insect exclusion require design attention
    - local multipoint monitoring is mandatory before sizing
  retained_as_hypothesis_only:
    - bimodal seasonal influence on facility load
    - topographic differences between Tenjo and Tabio
    - free-cooling and heat-recovery operating modes
    - high-pressure fogging or ultrasonic humidification
  rejected_as_operational_standard:
    - universal species setpoints
    - no ventilation during incubation
    - fixed 4 to 8 air changes per hour
    - universal CO2 threshold below 800 to 1000 ppm
    - fixed 50 mm insulation minimum
    - fixed G4 plus F7/F9 plus 50 mesh filtration train
    - fixed 70 to 80 bar fogging specification
    - fixed disease-risk months
