# Metadata — KPIs y Métricas Operacionales
# Setas de la Peña
# Última actualización: 2026-07-24
#
# DEC-013: Lentinula edodes es la especie prioritaria de arranque.
# Estado: preproducción, 0 lotes activos. Los umbrales biológicos y comerciales
# permanecen sin aprobar hasta completar pilotos trazables.

program:
  active_species: lentinula_edodes
  active_phase: preproduction
  active_batches: 0
  reference_sop: knowledge_base/06_operations/quality_control.md

production_kpis:
  traceability_completeness:
    name: Integridad de trazabilidad
    formula: "(campos críticos completos / campos críticos requeridos) × 100"
    unit: percent
    target: 100
    release_blocker_below: 100

  biological_efficiency:
    name: Eficiencia Biológica acumulada
    formula: "(peso fresco acumulado / peso seco inicial de sustrato) × 100"
    unit: percent
    target_min: null
    alert_threshold: null
    status: baseline_pending
    notes: "Registrar por flush y al cierre. No comparar estudios o lotes con denominadores distintos."

  contamination_rate:
    name: Tasa de contaminación
    formula: "(bloques contaminados / bloques inoculados) × 100"
    unit: percent
    target_max: null
    alert_threshold: null
    status: baseline_pending
    notes: "Toda contaminación exige aislamiento y registro; el umbral de programa se aprueba después del piloto."

  time_to_maturity:
    name: Tiempo a madurez del bloque
    unit: days
    target: null
    status: strain_dependent
    notes: "Definir criterio por cepa: colonización, firmeza, protuberancias y pardeamiento cuando aplique."

  time_to_pinning:
    name: Tiempo a primordios
    unit: days
    target: null
    status: strain_and_induction_dependent

  yield_per_block:
    name: Rendimiento por bloque
    unit: grams_fresh
    target: null
    status: baseline_pending

environmental_kpis:
  temperature_c:
    measurement_frequency: continuous
    logging: home_assistant
    alert_low: null
    alert_high: null
    source: batch_specification

  humidity_rh_percent:
    measurement_frequency: continuous
    logging: home_assistant
    alert_low: null
    alert_high: null
    source: batch_specification

  co2_ppm:
    measurement_frequency: continuous
    logging: home_assistant
    alert_max: null
    source: batch_specification
    notes: "No existe umbral de proyecto aprobado para shiitake."

  airflow:
    volume_effective_m3: null
    measured_flow_m3_h: null
    ach_target: null
    actuator_cycle: null
    status: chamber_measurement_pending
    notes: "No convertir minutos ON/OFF en ACH sin volumen efectivo y caudal medido bajo resistencia real."

  environmental_compliance:
    formula: "(tiempo dentro de banda versionada / tiempo con datos válidos) × 100"
    unit: percent
    target: null
    status: baseline_pending

financial_kpis:
  cost_per_kg_produced:
    formula: "costos variables trazables / kg vendible"
    unit: COP_per_kg
    target_max: null
    status: blocked_until_pilot_yield

  revenue_per_week:
    unit: COP
    target: null
    status: no_commercial_projection

  break_even_modules:
    estimate: null
    status: no_validated_cost_model

quality_kpis:
  premium_product_percent:
    formula: "(masa premium / masa fresca total) × 100"
    target: null
    status: buyer_specification_pending

  postharvest_loss_percent:
    formula: "(masa descartada o no vendible / masa cosechada) × 100"
    target: null
    status: baseline_pending

  shelf_life_days:
    fresh_refrigerated: null
    dried: null
    status: validation_and_regulatory_review_pending

logging:
  batch_log:
    frequency: per_batch
    template: knowledge_base/06_operations/batch_tracking.md
  environmental_log:
    frequency: continuous
    platform: home_assistant
    retention_days: 90
  financial_log:
    frequency: per_batch_and_monthly
    format: spreadsheet
