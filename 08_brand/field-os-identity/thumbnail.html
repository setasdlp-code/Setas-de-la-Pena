<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Setas de la Peña — thumbnail</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:flex;overflow:hidden}.main{flex:0 0 75%;background:var(--accent-olive);display:flex;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box}.mark{max-width:100%;max-height:260px;filter:brightness(0) invert(1)}.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}</style>
</head>
<body>
<div class="main"><img class="mark" src="assets/logo.png" alt="Setas de la Peña"></div>
<div class="strip">
<div style="background:#DEE5E7"></div>
<div style="background:#A85C32"></div>
<div style="background:#5E7080"></div>
<div style="background:#8C3223"></div>
</div>
</body>
</html>
