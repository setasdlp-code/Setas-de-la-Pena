<!-- @dsCard group="Colors" viewport="700x110" name="Status Labels" subtitle="Discrete status indicators — text + hairline, no filled badges" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:110px;background:var(--surface-page);padding:18px 20px;display:flex;gap:10px;align-items:center;overflow:hidden;font-family:var(--font-sans);font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;">
  <span style="border:1px solid var(--status-active);color:var(--status-active);padding:3px 8px;">Activo</span>
  <span style="border:1px solid var(--status-info);color:var(--status-info);padding:3px 8px;">En curso</span>
  <span style="border:1px solid var(--status-attention);color:var(--status-attention);padding:3px 8px;">Atención</span>
  <span style="border:1px solid var(--status-archived);color:var(--status-archived);padding:3px 8px;">Archivado</span>
  <span style="border:1px solid var(--status-error);color:var(--status-error);padding:3px 8px;">Contaminado</span>
</div>
