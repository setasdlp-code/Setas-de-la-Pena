<!-- @dsCard group="Colors" viewport="700x150" name="Paper & Ink" subtitle="Base surfaces and text tones" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;background:var(--surface-page);padding:16px 20px;display:flex;gap:0;overflow:hidden;font-family:var(--font-mono);font-size:10.5px;color:var(--text-metadata);">
  <div style="display:flex;flex-direction:column;">
    <div style="width:140px;height:60px;background:var(--paper-0);border:var(--rule-hairline);display:flex;align-items:flex-end;padding:4px;">paper-0</div>
    <div style="width:140px;height:60px;background:var(--paper-2);border:var(--rule-hairline);border-top:none;display:flex;align-items:flex-end;padding:4px;">paper-2</div>
  </div>
  <div style="display:flex;flex-direction:column;">
    <div style="width:140px;height:30px;background:var(--ink-0);color:var(--paper-0);display:flex;align-items:flex-end;padding:4px;">ink-0</div>
    <div style="width:140px;height:30px;background:var(--ink-1);color:var(--paper-0);display:flex;align-items:flex-end;padding:4px;">ink-1</div>
    <div style="width:140px;height:30px;background:var(--ink-2);color:var(--paper-0);display:flex;align-items:flex-end;padding:4px;">ink-2</div>
    <div style="width:140px;height:30px;background:var(--ink-3);color:var(--paper-0);display:flex;align-items:flex-end;padding:4px;">ink-3</div>
  </div>
</div>
