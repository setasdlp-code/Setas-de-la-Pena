<!-- @dsCard group="Colors" viewport="700x170" name="Paper & Ink" subtitle="Warm ivory ground, charcoal text, mineral rules" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:170px;background:var(--surface-page);padding:18px 20px;display:flex;gap:0;overflow:hidden">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:var(--paper);border:1px solid var(--rule);padding:10px">
    <span class="t-label">PAPER</span><span class="t-micro" style="margin-top:2px">#FAF5E9</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:var(--paper-panel);border:1px solid var(--rule);border-left:0;padding:10px">
    <span class="t-label">PANEL</span><span class="t-micro" style="margin-top:2px">#F3EEE2</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:var(--paper-recessed);border:1px solid var(--rule);border-left:0;padding:10px">
    <span class="t-label">RECESSED</span><span class="t-micro" style="margin-top:2px">#EAE4D8</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:var(--ink);padding:10px">
    <span class="t-label" style="color:var(--paper)">INK</span><span class="t-micro" style="margin-top:2px;color:var(--paper)">#222222</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:var(--ink-muted);padding:10px">
    <span class="t-label" style="color:var(--paper)">INK MUTED</span><span class="t-micro" style="margin-top:2px;color:var(--paper)">#555555</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:var(--rule);padding:10px">
    <span class="t-label" style="color:var(--paper)">RULE</span><span class="t-micro" style="margin-top:2px;color:var(--paper)">#888888</span>
  </div>
</div>
