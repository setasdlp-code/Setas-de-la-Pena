<!-- @dsCard group="Colors" viewport="700x190" name="Earth accents" subtitle="Soil, moss, rust, ochre — clasificación y estado, nunca adorno" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:190px;background:var(--surface-page);padding:18px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
  <div style="display:flex;gap:10px;flex:1">
    <div style="flex:1;background:var(--soil);padding:10px;display:flex;flex-direction:column;justify-content:space-between">
      <span class="t-label" style="color:var(--paper)">SOIL</span>
      <span class="t-micro" style="color:var(--paper)">#4A3C31 · infill</span>
    </div>
    <div style="flex:1;background:var(--moss);padding:10px;display:flex;flex-direction:column;justify-content:space-between">
      <span class="t-label" style="color:var(--paper)">MOSS</span>
      <span class="t-micro" style="color:var(--paper)">#4E6B3F · en espec.</span>
    </div>
    <div style="flex:1;background:var(--rust);padding:10px;display:flex;flex-direction:column;justify-content:space-between">
      <span class="t-label" style="color:var(--paper)">RUST</span>
      <span class="t-micro" style="color:var(--paper)">#8E2C14 · error</span>
    </div>
    <div style="flex:1;background:var(--warning);padding:10px;display:flex;flex-direction:column;justify-content:space-between">
      <span class="t-label" style="color:var(--ink)">WARNING</span>
      <span class="t-micro" style="color:var(--ink)">#C49A4C · precaución</span>
    </div>
  </div>
  <div style="display:flex;gap:10px;height:34px">
    <div style="flex:1;background:var(--soil-tint);border:1px solid var(--rule);display:flex;align-items:center;padding:0 10px"><span class="t-micro">SOIL TINT</span></div>
    <div style="flex:1;background:var(--moss-tint);border:1px solid var(--rule);display:flex;align-items:center;padding:0 10px"><span class="t-micro">MOSS TINT</span></div>
    <div style="flex:1;background:var(--rust-tint);border:1px solid var(--rule);display:flex;align-items:center;padding:0 10px"><span class="t-micro">RUST TINT</span></div>
    <div style="flex:1;background:var(--warning-tint);border:1px solid var(--rule);display:flex;align-items:center;padding:0 10px"><span class="t-micro">WARNING TINT</span></div>
  </div>
  <div class="t-micro" style="letter-spacing:var(--tracking-micro)">Un solo acento por vista · rust reservado a error y contaminación</div>
</div>
