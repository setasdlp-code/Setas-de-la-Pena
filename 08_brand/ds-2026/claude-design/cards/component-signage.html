<!-- @dsCard group="Components" viewport="700x300" name="Señalética de sala" subtitle="La única inversión sancionada: PAPER sobre SOIL" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:300px;background:var(--surface-panel);padding:18px;display:flex;align-items:center;overflow:hidden" data-mode="field">
  <section class="sdp-sign" style="width:100%">
    <header class="sdp-sign__hd" style="padding:16px 20px">
      <div>
        <div class="sdp-sign__fn" style="opacity:.8">SETAS DE LA PEÑA · TENJO</div>
        <div class="sdp-sign__room" style="margin-top:4px;font-size:34px">Sala 02 — Incubación</div>
      </div>
      <div style="text-align:right"><div class="sdp-sign__fn" style="opacity:.8">ACCESO</div><div class="sdp-sign__fn" style="font-size:15px;margin-top:4px">RESTRINGIDO</div></div>
    </header>
    <div class="sdp-sign__stats">
      <div class="sdp-sign__stat" style="padding:16px 20px">
        <span class="sdp-sign__sk">Humedad relativa</span><span class="sdp-sign__sv" style="font-size:28px">91<span style="font-size:14px;color:var(--text-metadata)"> %</span></span>
        <div style="height:4px;background:var(--surface-recessed);margin-top:10px"><span style="display:block;height:100%;width:82%;background:var(--moss)"></span></div>
      </div>
      <div class="sdp-sign__stat" style="padding:16px 20px">
        <span class="sdp-sign__sk">CO₂</span><span class="sdp-sign__sv" style="font-size:28px">742<span style="font-size:14px;color:var(--text-metadata)"> ppm</span></span>
        <div style="height:4px;background:var(--surface-recessed);margin-top:10px"><span style="display:block;height:100%;width:47%;background:var(--moss)"></span></div>
      </div>
      <div class="sdp-sign__stat" style="padding:16px 20px">
        <span class="sdp-sign__sk">Temperatura</span><span class="sdp-sign__sv" style="font-size:28px">24,0<span style="font-size:14px;color:var(--text-metadata)"> °C</span></span>
        <div style="height:4px;background:var(--surface-recessed);margin-top:10px"><span style="display:block;height:100%;width:60%;background:var(--moss)"></span></div>
      </div>
    </div>
    <footer class="sdp-sign__ft" style="padding:10px 20px"><div class="sdp-statusline">LOTE 026 · HER-01 · 17 AGO 2026</div></footer>
  </section>
</div>
