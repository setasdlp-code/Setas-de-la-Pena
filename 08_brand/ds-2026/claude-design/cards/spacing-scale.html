<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="Base de 8px; --space-half (4px) es la única excepción" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:180px;background:var(--surface-page);padding:18px 22px;display:flex;flex-direction:column;gap:10px;justify-content:center;overflow:hidden">
  <div style="display:flex;align-items:flex-end;gap:10px;height:96px">
    <div style="text-align:center"><div style="width:22px;height:4px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">4</span></div>
    <div style="text-align:center"><div style="width:22px;height:8px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">8</span></div>
    <div style="text-align:center"><div style="width:22px;height:16px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">16</span></div>
    <div style="text-align:center"><div style="width:22px;height:24px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">24</span></div>
    <div style="text-align:center"><div style="width:22px;height:32px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">32</span></div>
    <div style="text-align:center"><div style="width:22px;height:40px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">40</span></div>
    <div style="text-align:center"><div style="width:22px;height:48px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">48</span></div>
    <div style="text-align:center"><div style="width:22px;height:64px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">64</span></div>
    <div style="text-align:center"><div style="width:22px;height:80px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">80</span></div>
    <div style="text-align:center"><div style="width:22px;height:96px;background:var(--soil)"></div><span class="t-micro" style="display:block;margin-top:4px">96</span></div>
  </div>
  <div class="t-micro" style="letter-spacing:var(--tracking-micro)">Sin 2px, sin 6px, sin 10px</div>
</div>
