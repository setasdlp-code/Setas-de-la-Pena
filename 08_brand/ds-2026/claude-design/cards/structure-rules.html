<!-- @dsCard group="Structure" viewport="700x220" name="Filetes, sin sombra" subtitle="La profundidad es un filete, nunca un desenfoque" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:220px;background:var(--surface-page);padding:20px;display:flex;gap:18px;align-items:center;overflow:hidden">
  <div style="flex:1;display:flex;flex-direction:column;gap:12px">
    <div><div class="t-micro">HAIRLINE · 1px RULE</div><hr class="rule" style="margin:6px 0 0"></div>
    <div><div class="t-micro">HEAVY · 2px INK</div><hr class="rule--heavy" style="margin:6px 0 0"></div>
    <div><div class="t-micro">FRAME · 1px RULE en caja</div><div style="border:var(--rule-frame);height:26px;margin-top:6px"></div></div>
    <div><div class="t-micro">SPECIMEN · filete + contorno a 3px</div><div class="frame-specimen" style="height:26px;margin-top:8px"></div></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:8px">
    <span class="t-label">PROHIBIDO</span>
    <div class="t-micro">box-shadow — --shadow-none es el único valor legal</div>
    <div class="t-micro">gradiente, cristal, panel flotante</div>
    <div class="t-micro">radio mayor que 2px</div>
    <div class="t-micro" style="margin-top:8px">TAP TARGET ≥ 44px · guantes, luz exterior, una mano</div>
    <div style="display:flex;gap:8px;margin-top:2px">
      <div style="width:44px;height:44px;border:var(--rule-frame);display:flex;align-items:center;justify-content:center"><span class="t-micro">44</span></div>
      <div style="width:44px;height:44px;border:var(--rule-frame);display:flex;align-items:center;justify-content:center"><span class="t-micro">44</span></div>
    </div>
  </div>
</div>
