// ---- Ledger API -----------------------------------------------------------

const api = {
  async listLedger() {
    const response = await fetch('/api/ledger');
    if (!response.ok) throw new Error('No se pudo leer el ledger.');
    const body = await response.json();
    return body.events;
  },
  async append(event) {
    const response = await fetch('/api/ledger', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(event)
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || 'No se pudo registrar el evento.');
    }
    return (await response.json()).event;
  },
  async uploadPhoto(dataUrl, containerHint) {
    const response = await fetch('/api/photos', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ data: dataUrl, containerHint })
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || 'No se pudo subir la foto.');
    }
    return (await response.json()).photo_ref;
  },
  async listInventory() {
    const response = await fetch('/api/inventory');
    if (!response.ok) throw new Error('No se pudo leer el inventario.');
    return (await response.json()).items;
  },
  async upsertInventoryItem(item) {
    const response = await fetch('/api/inventory', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(item)
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || 'No se pudo guardar el ítem de inventario.');
    }
    return (await response.json()).item;
  }
};

// ---- Derived state from the append-only ledger ----------------------------
// Containers, their state, and their timeline are never stored directly —
// they are derived by reducing the immutable event list (INV-4).

const deriveContainers = (events) => {
  const containers = new Map();
  let seq = 0;

  const ensure = (id) => {
    if (!containers.has(id)) {
      containers.set(id, { id, especie: null, estado: 'activo', tl: [] });
    }
    return containers.get(id);
  };

  for (const event of events) {
    if (event.type === 'registro') {
      for (let index = 0; index < event.payload.count; index += 1) {
        seq += 1;
        const id = `C-${String(seq).padStart(4, '0')}`;
        const container = ensure(id);
        container.especie = event.payload.especie;
        container.tl.push({ id: event.id, ts: event.ts, type: 'registro', operator: event.operator });
      }
      continue;
    }
    if (event.type === 'cosecha') {
      const container = containers.get(event.payload.container_id);
      if (!container) continue;
      container.tl.push({ id: event.id, ts: event.ts, type: 'cosecha', operator: event.operator, payload: event.payload });
      if (event.payload.cierre) container.estado = 'cerrado';
      continue;
    }
    if (event.type === 'observacion' || event.type === 'evento_rapido') {
      for (const id of event.payload.container_ids) {
        const container = containers.get(id);
        if (!container) continue;
        container.tl.push({ id: event.id, ts: event.ts, type: event.type, operator: event.operator, payload: event.payload });
        if (event.type === 'evento_rapido' && event.payload.subtype === 'descarte') container.estado = 'cerrado';
        if (event.type === 'evento_rapido' && event.payload.subtype === 'contaminacion') container.estado = 'contaminado';
      }
      continue;
    }
    // 'anulacion' events are visible in the raw ledger/history but do not
    // rewrite derived container state — the original event stands (INV-3);
    // the anulación is itself the correction record.
  }

  return {
    seq,
    containers: [...containers.values()].sort((a, b) => (a.id < b.id ? 1 : -1))
  };
};

const nextSeq = (events) => deriveContainers(events).seq;

// ---- Toast with undo (10s window, compensating event, not client-side restore) ----

const ToastWithUndo = ({ toast, onUndo, onDismiss }) => {
  if (!toast) return null;
  const hasAction = Boolean(toast.action);
  return (
    <div
      className={`fos-toast ${hasAction ? 'fos-toast-undo' : 'fos-toast-plain'}`}
      style={{ pointerEvents: hasAction ? 'auto' : 'none' }}
      role="status"
      onAnimationEnd={onDismiss}
    >
      <span>{toast.message}</span>
      {hasAction && (
        <button type="button" className="fos-toast-action" onClick={onUndo}>Deshacer</button>
      )}
    </div>
  );
};

// ---- Photo attachment -------------------------------------------------------

const readAsDataUrl = (file) => new Promise((resolveRead, rejectRead) => {
  const reader = new FileReader();
  reader.onload = () => resolveRead(reader.result);
  reader.onerror = () => rejectRead(reader.error);
  reader.readAsDataURL(file);
});

const PhotoAttach = ({ preview, onSelect, onClear }) => (
  <div className="fos-photo-attach">
    <label className="fos-photo-label">Foto (opcional)</label>
    {preview ? (
      <div className="fos-photo-filled">
        <img src={preview} alt="Vista previa de la foto adjunta" className="fos-photo-thumb" />
        <button type="button" className="fos-photo-remove" onClick={onClear}>Quitar foto</button>
      </div>
    ) : (
      <label className="fos-photo-empty">
        <input
          type="file"
          accept="image/*"
          capture="environment"
          onChange={async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            onSelect(await readAsDataUrl(file), file);
          }}
        />
        <span>📷 Tomar / adjuntar foto</span>
      </label>
    )}
  </div>
);

// ---- Command palette: a small fixed grammar that executes actions, not just navigates ----

const COMMAND_PATTERNS = [
  { re: /^cosecha\s+([a-z]-\d+)/i, action: (m) => ({ screen: 'harvest', containerId: m[1].toUpperCase() }) },
  { re: /^observ(?:ar|a)\s+([a-z]-\d+)/i, action: (m) => ({ screen: 'observe', containerId: m[1].toUpperCase() }) },
  { re: /^contamina\w*\s+([a-z]-\d+)/i, action: (m) => ({ screen: 'quick', subtype: 'contaminacion', containerId: m[1].toUpperCase() }) },
  { re: /^registr(?:ar|a)\b/i, action: () => ({ screen: 'register' }) },
  { re: /^(sesi[oó]n|iniciar)\b/i, action: () => ({ screen: 'home' }) }
];

const matchCommand = (query) => {
  const trimmed = query.trim();
  if (!trimmed) return null;
  for (const pattern of COMMAND_PATTERNS) {
    const match = pattern.re.exec(trimmed);
    if (match) return pattern.action(match);
  }
  return null;
};

// ---- Forms -------------------------------------------------------------

const RegistrarForm = ({ onSubmit }) => {
  const [especie, setEspecie] = useState('');
  const [count, setCount] = useState(1);
  const [busy, setBusy] = useState(false);

  const submit = async (event) => {
    event.preventDefault();
    if (!especie.trim()) return;
    setBusy(true);
    try {
      await onSubmit({ especie: especie.trim(), count: Number(count) });
      setEspecie('');
      setCount(1);
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="fos-form" onSubmit={submit}>
      <h2>Registrar contenedores</h2>
      <label>Especie
        <input value={especie} onChange={(event) => setEspecie(event.target.value)} required />
      </label>
      <label>Cantidad
        <input type="number" min="1" max="500" value={count} onChange={(event) => setCount(event.target.value)} required />
      </label>
      <button type="submit" disabled={busy}>Registrar</button>
    </form>
  );
};

const CosechaForm = ({ containers, initialContainerId, onSubmit }) => {
  const [containerId, setContainerId] = useState(initialContainerId || '');
  const [pesoG, setPesoG] = useState('');
  const [destino, setDestino] = useState('');
  const [cierre, setCierre] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => { if (initialContainerId) setContainerId(initialContainerId); }, [initialContainerId]);

  const submit = async (event) => {
    event.preventDefault();
    if (!containerId || !destino.trim()) return;
    setBusy(true);
    try {
      await onSubmit({ container_id: containerId, peso_g: Number(pesoG), destino: destino.trim(), cierre });
      setPesoG(''); setDestino(''); setCierre(false);
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="fos-form" onSubmit={submit}>
      <h2>Registrar cosecha</h2>
      <label>Contenedor
        <select value={containerId} onChange={(event) => setContainerId(event.target.value)} required>
          <option value="">Seleccionar…</option>
          {containers.map((container) => (
            <option key={container.id} value={container.id}>{container.id} · {container.especie}</option>
          ))}
        </select>
      </label>
      <label>Peso (g)
        <input type="number" min="0" step="1" value={pesoG} onChange={(event) => setPesoG(event.target.value)} required />
      </label>
      <label>Destino
        <input value={destino} onChange={(event) => setDestino(event.target.value)} required />
      </label>
      <label className="fos-checkbox">
        <input type="checkbox" checked={cierre} onChange={(event) => setCierre(event.target.checked)} />
        Cerrar contenedor
      </label>
      <button type="submit" disabled={busy}>Registrar cosecha</button>
    </form>
  );
};

const MultiContainerSelect = ({ containers, selected, onToggle }) => (
  <div className="fos-multiselect">
    {containers.map((container) => (
      <label key={container.id} className="fos-multiselect-row">
        <input
          type="checkbox"
          checked={selected.includes(container.id)}
          onChange={() => onToggle(container.id)}
        />
        {container.id} · {container.especie}
      </label>
    ))}
  </div>
);

const ObservacionForm = ({ containers, initialContainerId, onSubmit }) => {
  const [selected, setSelected] = useState(initialContainerId ? [initialContainerId] : []);
  const [tagsInput, setTagsInput] = useState('');
  const [nota, setNota] = useState('');
  const [photo, setPhoto] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (initialContainerId) setSelected((prev) => (prev.includes(initialContainerId) ? prev : [...prev, initialContainerId]));
  }, [initialContainerId]);

  const toggle = (id) => setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));

  const submit = async (event) => {
    event.preventDefault();
    if (selected.length === 0) return;
    setBusy(true);
    try {
      await onSubmit({
        container_ids: selected,
        tags: tagsInput.split(',').map((tag) => tag.trim()).filter(Boolean),
        nota,
        photoDataUrl: photo
      });
      setSelected([]); setTagsInput(''); setNota(''); setPhoto(null);
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="fos-form" onSubmit={submit}>
      <h2>Observación</h2>
      <MultiContainerSelect containers={containers} selected={selected} onToggle={toggle} />
      <label>Etiquetas (separadas por coma)
        <input value={tagsInput} onChange={(event) => setTagsInput(event.target.value)} />
      </label>
      <label>Nota
        <textarea value={nota} onChange={(event) => setNota(event.target.value)} />
      </label>
      <PhotoAttach preview={photo} onSelect={setPhoto} onClear={() => setPhoto(null)} />
      <button type="submit" disabled={busy || selected.length === 0}>Guardar observación</button>
    </form>
  );
};

const QUICK_SUBTYPES = [
  { value: 'traslado', label: 'Traslado' },
  { value: 'contaminacion', label: 'Contaminación' },
  { value: 'marca', label: 'Marca' },
  { value: 'descarte', label: 'Descarte' }
];

const EventoRapidoForm = ({ containers, initialContainerId, initialSubtype, onSubmit }) => {
  const [selected, setSelected] = useState(initialContainerId ? [initialContainerId] : []);
  const [subtype, setSubtype] = useState(initialSubtype || 'traslado');
  const [causaRaiz, setCausaRaiz] = useState('');
  const [nota, setNota] = useState('');
  const [photo, setPhoto] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (initialContainerId) setSelected((prev) => (prev.includes(initialContainerId) ? prev : [...prev, initialContainerId]));
    if (initialSubtype) setSubtype(initialSubtype);
  }, [initialContainerId, initialSubtype]);

  const toggle = (id) => setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));

  const submit = async (event) => {
    event.preventDefault();
    if (selected.length === 0) return;
    if (subtype === 'contaminacion' && !causaRaiz.trim()) return;
    setBusy(true);
    try {
      await onSubmit({
        container_ids: selected,
        subtype,
        causa_raiz: subtype === 'contaminacion' ? causaRaiz.trim() : null,
        nota,
        photoDataUrl: photo
      });
      setSelected([]); setCausaRaiz(''); setNota(''); setPhoto(null);
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="fos-form" onSubmit={submit}>
      <h2>Evento rápido</h2>
      <label>Tipo
        <select value={subtype} onChange={(event) => setSubtype(event.target.value)}>
          {QUICK_SUBTYPES.map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}
        </select>
      </label>
      <MultiContainerSelect containers={containers} selected={selected} onToggle={toggle} />
      {subtype === 'contaminacion' && (
        <label>Causa raíz (obligatoria)
          <input value={causaRaiz} onChange={(event) => setCausaRaiz(event.target.value)} required />
        </label>
      )}
      <label>Nota
        <textarea value={nota} onChange={(event) => setNota(event.target.value)} />
      </label>
      <PhotoAttach preview={photo} onSelect={setPhoto} onClear={() => setPhoto(null)} />
      <button type="submit" disabled={busy || selected.length === 0}>Guardar evento</button>
    </form>
  );
};

const HistoryView = ({ containers }) => (
  <div className="fos-history">
    <h2>Historial</h2>
    {containers.length === 0 && <p className="fos-empty">Aún no hay contenedores registrados.</p>}
    {containers.map((container) => (
      <details key={container.id} className="fos-history-item">
        <summary>{container.id} · {container.especie} · <span className={`fos-pill fos-pill-${container.estado}`}>{container.estado}</span></summary>
        <ul>
          {container.tl.slice().reverse().map((entry) => (
            <li key={entry.id + entry.type}>
              <span className="fos-mono">{new Date(entry.ts).toLocaleString('es-CO')}</span> — {entry.type}
              {entry.payload && entry.payload.nota ? `: “${entry.payload.nota}”` : ''}
              {entry.payload && entry.payload.photo_ref ? (
                <a href={`/photos/${entry.payload.photo_ref}`} target="_blank" rel="noopener noreferrer" className="fos-history-photo-link">
                  <img src={`/photos/${entry.payload.photo_ref}`} alt="Foto adjunta al evento" className="fos-photo-thumb fos-history-photo-thumb" />
                </a>
              ) : ''}
            </li>
          ))}
        </ul>
      </details>
    ))}
  </div>
);

const buildSessionSummary = (events, handoffNote) => {
  const cosechas = events.filter((event) => event.type === 'cosecha');
  const kg = cosechas.reduce((sum, event) => sum + (event.payload.peso_g || 0), 0) / 1000;
  const contaminaciones = events.filter((event) => event.type === 'evento_rapido' && event.payload.subtype === 'contaminacion').length;
  const lines = [
    '*Resumen de sesión — Setas de la Peña*',
    `_${new Date().toLocaleString('es-CO')}_`,
    `Eventos registrados: ${events.length}`,
    `Cosechas: ${cosechas.length} (${kg.toFixed(2)} kg)`
  ];
  if (contaminaciones > 0) lines.push(`Contaminaciones: ${contaminaciones}`);
  if (handoffNote.trim()) lines.push('', `Nota de traspaso: ${handoffNote.trim()}`);
  return lines.join('\n');
};

const SessionEndView = ({ events, onFinish }) => {
  const [handoffNote, setHandoffNote] = useState('');
  const [shared, setShared] = useState(false);

  const share = async () => {
    const summary = buildSessionSummary(events, handoffNote);
    try { await navigator.clipboard.writeText(summary); } catch (_) { /* best-effort */ }
    window.open(`https://wa.me/?text=${encodeURIComponent(summary)}`, '_blank', 'noopener');
    setShared(true);
  };

  return (
    <div className="fos-form">
      <h2>Cierre de sesión</h2>
      <label>Nota de traspaso
        <textarea value={handoffNote} onChange={(event) => setHandoffNote(event.target.value)} />
      </label>
      <button type="button" onClick={() => onFinish(handoffNote)}>Finalizar sesión y guardar traspaso</button>
      <button type="button" className="fos-btn-outline" onClick={share}>Compartir resumen al siguiente turno</button>
      {shared && <p className="fos-empty">Resumen copiado y WhatsApp abierto.</p>}
    </div>
  );
};

// ---- Cámaras: climate snapshot + alert escalation --------------------------
// NOTE: this monitoring/escalation surface is carried over from the design
// handoff as-is. It is not yet covered by FIELD_OS_MVP_ARCHITECTURE.md, which
// defers notifications/monitoring pending validated sensor trust (IN-3) — see
// field_os/FIELD_OS_V2_BUILD_PLAN.md §1. Flagged for governance review, not
// resolved here.

const CAMARAS_MOCK = [
  { key: 'camara-1', label: 'Cámara 1 · Incubación', temp: 24.1, humidity: 78, co2: 820 },
  { key: 'camara-2', label: 'Cámara 2 · Fructificación', temp: 21.4, humidity: 91, co2: 1180 },
  { key: 'camara-3', label: 'Cámara 3 · Fructificación', temp: 26.8, humidity: 84, co2: 1420 }
];

// Alerts are keyed by chamber and carry a `since` timestamp; the escalation
// window (>2h unresolved) is fixed at construction so this stays deterministic
// across renders rather than depending on a live clock inside the component.
const ESCALATION_WINDOW_MS = 2 * 60 * 60 * 1000;

const buildChamberAlerts = (nowMs) => ({
  'camara-2': { key: 'camara-2', label: 'Cámara 2', reason: 'Humedad sobre el rango (91%)', since: nowMs - (3 * 60 * 60 * 1000) },
  'camara-3': { key: 'camara-3', label: 'Cámara 3', reason: 'CO₂ elevado (1420 ppm)', since: nowMs - (45 * 60 * 1000) }
});

const ageLabel = (fromMs, nowMs) => {
  const minutes = Math.max(0, Math.round((nowMs - fromMs) / 60000));
  const hours = Math.floor(minutes / 60);
  return hours > 0 ? `hace ${hours}h ${minutes % 60}m` : `hace ${minutes}m`;
};

const withEscalation = (alerts, nowMs) => Object.values(alerts).map((alert) => ({
  ...alert,
  escalated: (nowMs - alert.since) > ESCALATION_WINDOW_MS,
  age: ageLabel(alert.since, nowMs)
}));

// ---- Inventario: low-stock banner (Bodega) ---------------------------------
// Backed by a real store (server/inventory-store.mjs, /api/inventory).
// `status` is always server-derived from cantidad vs minimo — never a value
// the client can set directly (DATA_MODEL §2.17; MODULE_MAP §5.3).

const InventoryForm = ({ onSubmit }) => {
  const [lote, setLote] = useState('');
  const [insumo, setInsumo] = useState('');
  const [unidad, setUnidad] = useState('kg');
  const [cantidad, setCantidad] = useState('');
  const [minimo, setMinimo] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (event) => {
    event.preventDefault();
    if (!lote.trim() || !insumo.trim() || !unidad.trim()) return;
    setBusy(true);
    try {
      await onSubmit({
        lote: lote.trim(),
        insumo: insumo.trim(),
        unidad: unidad.trim(),
        cantidad: Number(cantidad),
        minimo: Number(minimo)
      });
      setLote(''); setInsumo(''); setCantidad(''); setMinimo('');
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="fos-form fos-inventory-form" onSubmit={submit}>
      <h3>Registrar / actualizar lote</h3>
      <label>Lote (ID)
        <input value={lote} onChange={(event) => setLote(event.target.value)} placeholder="Salvado-L11" required />
      </label>
      <label>Insumo
        <input value={insumo} onChange={(event) => setInsumo(event.target.value)} required />
      </label>
      <label>Unidad
        <input value={unidad} onChange={(event) => setUnidad(event.target.value)} required />
      </label>
      <label>Cantidad
        <input type="number" min="0" step="0.1" value={cantidad} onChange={(event) => setCantidad(event.target.value)} required />
      </label>
      <label>Mínimo
        <input type="number" min="0" step="0.1" value={minimo} onChange={(event) => setMinimo(event.target.value)} required />
      </label>
      <button type="submit" disabled={busy}>Guardar</button>
    </form>
  );
};

// ---- Roles ------------------------------------------------------------------
// Single-operator/single-reviewer model per MVP-1; this ROLE_GATE is carried
// over from the handoff for parity and is NOT a real permissions model —
// there is no server-side enforcement. See FIELD_OS_V2_BUILD_PLAN.md §1.

const ROLES = ['operador', 'revisor', 'gerencia'];
const ROLE_GATE = {
  inventario: ['revisor', 'gerencia']
};
const isTabVisibleForRole = (tabKey, role) => !ROLE_GATE[tabKey] || ROLE_GATE[tabKey].includes(role);

// ---- Root app ------------------------------------------------------------

const SCREEN_TITLES = {
  inicio: 'Inicio',
  home: 'Sesión',
  register: 'Registrar',
  harvest: 'Cosecha',
  observe: 'Observación',
  quick: 'Evento rápido',
  camaras: 'Cámaras',
  inventario: 'Inventario',
  history: 'Historial',
  end: 'Cierre de sesión'
};

const App = () => {
  const [events, setEvents] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [screen, setScreen] = useState('inicio');
  const [screenParams, setScreenParams] = useState({});
  const [toast, setToast] = useState(null);
  const [commandQuery, setCommandQuery] = useState('');
  const [role, setRole] = useState('operador');
  const [inventoryItems, setInventoryItems] = useState([]);
  const undoTimer = useRef(null);

  const reloadInventory = useCallback(() => (
    api.listInventory().then(setInventoryItems)
  ), []);

  useEffect(() => {
    api.listLedger().then((loadedEvents) => { setEvents(loadedEvents); setLoaded(true); });
    reloadInventory();
  }, [reloadInventory]);

  const { containers } = useMemo(() => deriveContainers(events), [events]);

  const nowMs = useMemo(() => Date.now(), []);
  const chamberAlerts = useMemo(() => withEscalation(buildChamberAlerts(nowMs), nowMs), [nowMs]);
  const escalatedAlerts = chamberAlerts.filter((alert) => alert.escalated);
  const lowStockRows = inventoryItems.filter((item) => item.status === 'Reponer');

  const showToast = useCallback((message, undoAction) => {
    if (undoTimer.current) clearTimeout(undoTimer.current);
    setToast({ message, action: undoAction || null });
    undoTimer.current = setTimeout(() => setToast(null), undoAction ? 10_000 : 2_600);
  }, []);

  const append = useCallback(async (type, payload, operator = 'operador') => {
    const event = await api.append({ type, operator, payload });
    setEvents((prev) => [...prev, event]);
    return event;
  }, []);

  const undoLast = useCallback(async (eventId) => {
    if (undoTimer.current) clearTimeout(undoTimer.current);
    await append('anulacion', { ref_event_id: eventId }, 'operador');
    showToast('Acción deshecha ✓');
  }, [append, showToast]);

  const withUndoToast = (label) => (event) => {
    showToast(label, () => undoLast(event.id));
  };

  const go = (nextScreen, params = {}) => { setScreen(nextScreen); setScreenParams(params); };

  const runCommand = (event) => {
    event.preventDefault();
    const action = matchCommand(commandQuery);
    if (!action) { showToast('Sin coincidencias para ese comando.'); return; }
    go(action.screen, action);
    setCommandQuery('');
  };

  const containerHintFor = (payload) => (
    payload.container_id || (payload.container_ids && payload.container_ids[0]) || undefined
  );

  const resolvePhotoRef = async (dataUrl, hint) => (dataUrl ? api.uploadPhoto(dataUrl, hint) : null);

  if (!loaded) return <div className="fos-loading">Cargando sesión…</div>;

  return (
    <div className="fos-app">
      <header className="fos-header">
        <h1>Sesión de campo</h1>
        <form className="fos-command" onSubmit={runCommand}>
          <input
            placeholder="⌘K — ej. «cosecha C-0004», «observar C-0002», «registrar»"
            value={commandQuery}
            onChange={(event) => setCommandQuery(event.target.value)}
          />
        </form>
        <label className="fos-role-select">Rol (demo, sin aplicación en servidor)
          <select value={role} onChange={(event) => setRole(event.target.value)}>
            {ROLES.map((option) => <option key={option} value={option}>{option}</option>)}
          </select>
        </label>
      </header>

      <nav className="fos-tabs" aria-label="Pantallas de sesión">
        {Object.entries(SCREEN_TITLES).filter(([key]) => isTabVisibleForRole(key, role)).map(([key, label]) => (
          <button
            key={key}
            className={screen === key ? 'fos-tab active' : 'fos-tab'}
            onClick={() => go(key)}
            type="button"
          >{label}</button>
        ))}
      </nav>

      <main className="fos-main" role="main" id="main-content">
        {screen === 'inicio' && (
          <div className="fos-home">
            <h2>Inicio</h2>
            {escalatedAlerts.length > 0 && (
              <div className="fos-banner fos-banner-alert" role="alert">
                <strong>⚠️ Alerta climática escalada</strong>
                <ul>
                  {escalatedAlerts.map((alert) => (
                    <li key={alert.key}>{alert.label}: {alert.reason} · {alert.age} <span className="fos-pill fos-pill-contaminado">Escalada</span></li>
                  ))}
                </ul>
                <button type="button" onClick={() => go('camaras')}>Resolver ahora</button>
              </div>
            )}
            {lowStockRows.length > 0 && isTabVisibleForRole('inventario', role) && (
              <div className="fos-banner fos-banner-stock">
                <strong>Stock bajo mínimo · {lowStockRows.length}</strong>
                <span> {lowStockRows.map((row) => row.lote).join(', ')}</span>
                <button type="button" onClick={() => go('inventario')}>Ver inventario</button>
              </div>
            )}
            <p>{containers.length} contenedores activos · {events.length} eventos en el ledger.</p>
            <div className="fos-quick-tiles">
              <button type="button" onClick={() => go('home')}>Ir a sesión</button>
              <button type="button" onClick={() => go('register')}>Registrar</button>
              <button type="button" onClick={() => go('harvest')}>Cosecha</button>
              <button type="button" onClick={() => go('history')}>Historial</button>
            </div>
          </div>
        )}

        {screen === 'camaras' && (
          <div className="fos-home">
            <h2>Cámaras</h2>
            {CAMARAS_MOCK.map((chamber) => {
              const alert = chamberAlerts.find((item) => item.key === chamber.key);
              return (
                <div key={chamber.key} className={alert ? 'fos-chamber-row fos-chamber-row-alert' : 'fos-chamber-row'}>
                  <strong>{chamber.label}</strong>
                  <span>{chamber.temp}°C · {chamber.humidity}% HR · {chamber.co2} ppm CO₂</span>
                  {alert && (
                    <span>
                      {alert.reason} · {alert.age}
                      {alert.escalated && <span className="fos-pill fos-pill-contaminado">Escalada</span>}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {screen === 'inventario' && isTabVisibleForRole('inventario', role) && (
          <div className="fos-home">
            <h2>Inventario · Bodega</h2>
            {inventoryItems.length === 0 && <p className="fos-empty">Aún no hay lotes registrados.</p>}
            <table className="fos-table">
              <thead><tr><th>Lote</th><th>Insumo</th><th>Cantidad</th><th>Mínimo</th><th>Estado</th></tr></thead>
              <tbody>
                {inventoryItems.map((rowItem) => (
                  <tr key={rowItem.lote}>
                    <td>{rowItem.lote}</td>
                    <td>{rowItem.insumo}</td>
                    <td>{rowItem.cantidad} {rowItem.unidad}</td>
                    <td>{rowItem.minimo} {rowItem.unidad}</td>
                    <td><span className={rowItem.status === 'Reponer' ? 'fos-pill fos-pill-contaminado' : 'fos-pill fos-pill-activo'}>{rowItem.status}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <InventoryForm onSubmit={async (item) => {
              await api.upsertInventoryItem(item);
              await reloadInventory();
            }} />
          </div>
        )}

        {screen === 'home' && (
          <div className="fos-home">
            <p>{containers.length} contenedores activos · {events.length} eventos en el ledger.</p>
            <div className="fos-quick-tiles">
              <button type="button" onClick={() => go('register')}>Registrar</button>
              <button type="button" onClick={() => go('harvest')}>Cosecha</button>
              <button type="button" onClick={() => go('observe')}>Observación</button>
              <button type="button" onClick={() => go('quick')}>Evento rápido</button>
            </div>
          </div>
        )}

        {screen === 'register' && (
          <RegistrarForm onSubmit={async (payload) => {
            const event = await append('registro', payload);
            withUndoToast(`Registrados ${payload.count} contenedor(es) ✓`)(event);
          }} />
        )}

        {screen === 'harvest' && (
          <CosechaForm
            containers={containers}
            initialContainerId={screenParams.containerId}
            onSubmit={async (payload) => {
              const event = await append('cosecha', payload);
              withUndoToast('Cosecha registrada ✓')(event);
            }}
          />
        )}

        {screen === 'observe' && (
          <ObservacionForm
            containers={containers}
            initialContainerId={screenParams.containerId}
            onSubmit={async ({ photoDataUrl, ...payload }) => {
              const photo_ref = await resolvePhotoRef(photoDataUrl, containerHintFor(payload));
              const event = await append('observacion', { ...payload, photo_ref });
              withUndoToast(photo_ref ? 'Observación guardada con foto ✓' : 'Observación guardada ✓')(event);
            }}
          />
        )}

        {screen === 'quick' && (
          <EventoRapidoForm
            containers={containers}
            initialContainerId={screenParams.containerId}
            initialSubtype={screenParams.subtype}
            onSubmit={async ({ photoDataUrl, ...payload }) => {
              const photo_ref = await resolvePhotoRef(photoDataUrl, containerHintFor(payload));
              const event = await append('evento_rapido', { ...payload, photo_ref });
              withUndoToast(photo_ref ? 'Evento guardado con foto ✓' : 'Evento guardado ✓')(event);
            }}
          />
        )}

        {screen === 'history' && <HistoryView containers={containers} />}

        {screen === 'end' && (
          <SessionEndView
            events={events}
            onFinish={() => showToast('Sesión finalizada y traspaso guardado ✓')}
          />
        )}
      </main>

      <ToastWithUndo toast={toast} onUndo={() => { toast.action(); setToast(null); }} onDismiss={() => setToast(null)} />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script type="text/babel">
// No post-render visual tweaks yet for this module — kept as an empty Babel
// block so the shared build pipeline's two-block assumption holds.
</script>
</body>
</html>
